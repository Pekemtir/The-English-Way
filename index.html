L(14,'a1','Likes and dislikes','Gustos: like, love, hate y want to','❤️',22,
["Decir lo que te gusta y lo que no con like, love y hate","Usar el verbo con -ing después de like","Usar want to para expresar deseos","Hablar de aficiones y deportes"],
[
["Like, love, hate","<p>Para expresar gustos usa estos verbos. Se conjugan como el resto del presente simple (con <b>-s</b> en he/she/it).</p>",mt(["Verb","Meaning","Example"],[["love","amar, encantar","I love music."],["like","gustar","I like tea."],["don’t like","no gustar","I don’t like coffee."],["hate","odiar","I hate mornings."]]),[["She loves animals.","A ella le encantan los animales."],["He doesn’t like fish.","A él no le gusta el pescado."],["They hate waiting.","Odian esperar."]],"En español «me gusta» tiene el objeto como sujeto. En inglés el sujeto eres tú: «<b>I like</b> music». Se dice <b>I like it</b> / <b>I like them</b>."],
["Like + -ing","<p>Cuando lo que te gusta es una <b>actividad</b>, el verbo siguiente va en forma <b>-ing</b>: <b>I like swimming</b>.</p>",mt(["Verb","+ -ing","Example"],[["like","swimming","I like swimming."],["love","cooking","She loves cooking."],["hate","running","He hates running."],["enjoy","reading","We enjoy reading."]]),[["I like watching films.","Me gusta ver películas."],["He loves playing football.","Le encanta jugar al fútbol."],["Do you enjoy dancing?","¿Disfrutas bailando?"]],"Reglas del -ing: la mayoría solo suma -ing (<b>play → playing</b>); si termina en -e, se quita (<b>dance → dancing</b>); algunos duplican la consonante (<b>swim → swimming</b>, <b>run → running</b>)."],
["Want to","<p>Para decir lo que quieres hacer se usa <b>want to</b> + verbo base. Para quién o qué quieres: <b>want</b> + sustantivo.</p>",mt(["Pattern","Example"],[["want + sustantivo","I want a coffee."],["want to + verbo","I want to go home."],["don’t want to","I don’t want to work."],["Do you want to…?","Do you want to come?"]]),[["I want to learn English.","Quiero aprender inglés."],["She doesn’t want to cook.","Ella no quiere cocinar."],["Do you want to play tennis?","¿Quieres jugar al tenis?"]],"No se dice «I want that you come». Con otra persona se dice <b>I want you to come</b> (lo verás más adelante)."],
["Hobbies and sports","<p>Aficiones y deportes más habituales. Se juegan (<b>play</b>) los deportes de equipo y de pelota; se hace (<b>do</b>) yoga o gimnasia; se va (<b>go</b>) con actividades en -ing.</p>",mt(["With","Examples"],[["play","play football, play tennis, play the guitar"],["do","do yoga, do karate"],["go","go swimming, go running, go cycling"]]),[["I play football on Saturdays.","Juego al fútbol los sábados."],["She goes swimming every week.","Ella va a nadar cada semana."]],"Con instrumentos musicales lleva artículo: <b>play the guitar</b>, <b>play the piano</b>."]
],
[["like","gustar"],["love","amar, encantar"],["hate","odiar"],["enjoy","disfrutar"],["want to","querer"],["swimming","nadar, natación"],["dancing","bailar, baile"],["hobby","afición"],["play","jugar"],["go swimming","ir a nadar"]],
[
c("«She ___ cooking.»","loves",["love","loving","is love"],"She + loves."),
c("«I like ___ films.»","watching",["watch","watches","to watching"],"Like + -ing."),
c("«He ___ like fish.» (no le gusta)","doesn’t",["don’t","isn’t","not"],"He + doesn’t like."),
c("«I want ___ home.»","to go",["go","going","goes"],"Want + to + verbo."),
c("«Do you want ___ tennis?»","to play",["play","playing","plays"],"Want to play."),
c("«I hate ___ early.»","getting up",["get up","gets up","to getting up"],"Hate + -ing."),
c("El -ing de «swim» es…","swimming",["swiming","swimeing","swimming up"],"Duplica la m."),
c("El -ing de «dance» es…","dancing",["danceing","dancening","danc"],"Quita la e."),
t("Completa: «I enjoy ___.» (read)","reading","Enjoy + -ing."),
t("Completa: «She ___ to dance.» (want)","wants","She wants to…"),
t("«He ___ football on Sundays.» (play)","plays","He plays."),
b("Me encanta cocinar","I love cooking","","Love + -ing."),
b("No quiero trabajar mañana","I don’t want to work tomorrow","","Don’t want to + verbo.")
],['hobbies','animals']);

L(15,'a1','Food and drink','Comida y bebida: some, any, much, many','🍽️',25,
["Nombrar alimentos y bebidas","Distinguir sustantivos contables e incontables","Usar some y any","Usar much, many y a lot of"],
[
["Food and drink","<p>Aprende los alimentos y bebidas más habituales. Escúchalos.</p>",mt(["Food","Drink"],[[SW("bread, cheese, egg, rice, meat, chicken, fish, apple, banana, pasta"),SW("water, tea, coffee, milk, juice, beer, wine")]]),[["I have bread and cheese for breakfast.","Desayuno pan y queso."],["She drinks tea in the morning.","Ella bebe té por la mañana."]],"Con las comidas se usa <b>have</b>: <b>have breakfast, lunch, dinner</b>. «Tomar café» es <b>have coffee</b> o <b>drink coffee</b>."],
["Countable and uncountable","<p>Los sustantivos <b>contables</b> se pueden contar (<b>an apple, two apples</b>). Los <b>incontables</b> no se cuentan y no tienen plural (<b>water, bread, rice, milk</b>). Para contarlos se usa un envase: <b>a glass of water</b>.</p>",mt(["Countable","Uncountable"],[["an apple, two apples","water, milk"],["an egg, three eggs","bread, rice"],["a banana, a lot of bananas","cheese, meat"]]),[["I need two eggs and some milk.","Necesito dos huevos y algo de leche."],["A cup of tea, please.","Una taza de té, por favor."]],"Para contar incontables: <b>a glass of</b> water, <b>a slice of</b> bread, <b>a piece of</b> cake, <b>a bottle of</b> milk."],
["Some and any","<p><b>Some</b> se usa en frases afirmativas. <b>Any</b> se usa en negativas y preguntas. Sirven con incontables y plurales.</p>",mt(["Type","Word","Example"],[["Affirmative","some","I have some bread."],["Negative","not any","I don’t have any milk."],["Question","any","Do you have any eggs?"]]),[["There is some cheese in the fridge.","Hay algo de queso en la nevera."],["There aren’t any apples.","No hay manzanas."],["Would you like some water?","¿Quieres agua?"]],"En ofrecimientos y peticiones se usa <b>some</b>: «Would you like <b>some</b> tea?», «Can I have <b>some</b> water?»."],
["How much / How many","<p>Para preguntar por cantidades: <b>How many</b> con contables en plural, <b>How much</b> con incontables. Para responder: <b>a lot of</b> (mucho), <b>a little</b> (un poco), <b>a few</b> (unos pocos).</p>",mt(["Question","Example"],[["How many + plural","How many eggs do you want?"],["How much + incontable","How much milk do you need?"],["a lot of","I eat a lot of fruit."]]),[["How many apples are there? – There are six.","¿Cuántas manzanas hay? – Seis."],["How much sugar do you want? – Just a little.","¿Cuánto azúcar quieres? – Solo un poco."]],"No confundas <b>How much</b> (¿cuánto?) del precio con la cantidad: «How much is it?» (precio) frente a «How much milk?» (cantidad)."]
],
[["bread","pan"],["cheese","queso"],["egg","huevo"],["water","agua"],["milk","leche"],["some","algo de, unos"],["any","ningún, algún"],["a lot of","mucho"],["how many","cuántos"],["how much","cuánto"]],
[
c("«I need ___ milk.» (afirmativa)","some",["any","a","an"],"Afirmativa: some."),
c("«Do you have ___ eggs?»","any",["some","a","an"],"Pregunta: any."),
c("«There aren’t ___ apples.»","any",["some","a","an"],"Negativa: any."),
c("«How ___ eggs do you want?»","many",["much","a lot","any"],"Huevos = contable: many."),
c("«How ___ milk do you need?»","much",["many","some","few"],"Leche = incontable: much."),
c("¿Cuál es incontable?","water",["egg","apple","banana"],"Water no se cuenta."),
c("«I have ___ egg for breakfast.»","an",["some","a","any"],"Egg empieza por vocal: an."),
c("«A ___ of water, please.»","glass",["slice","piece","packet"],"A glass of water."),
t("«Would you like ___ tea?» (ofrecimiento)","some","En ofrecimientos: some."),
t("«I don’t have ___ bread.»","any","Negativa: any."),
t("Escribe en inglés: «queso»","cheese","Cheese."),
b("¿Cuántos huevos quieres?","how many eggs do you want","","How many + plural + do you want."),
b("Hay algo de leche en la nevera","there is some milk in the fridge","","There is + some + incontable.")
],['food1','drinks','fruit','meals']);

L(16,'a1','Shopping','De compras: how much, would like y la ropa','🛍️',22,
["Preguntar precios con How much…?","Pedir con I’d like… y Can I have…?","Nombrar tiendas y prendas de ropa","Hablar de tallas, colores y formas de pago"],
[
["Shops and clothes","<p>Las tiendas y la ropa que vas a necesitar. Escucha y repite.</p>",mt(["Shops","Clothes"],[[SW("supermarket, bakery, chemist’s, bookshop, market"),SW("shirt, jumper, jacket, dress, trousers, shoes, hat")]]),[["I buy bread at the bakery.","Compro pan en la panadería."],["I need a pair of shoes.","Necesito un par de zapatos."]],"<b>Trousers, jeans, shoes, glasses</b> son siempre plurales: «these trousers are new». Para uno solo se dice <b>a pair of trousers</b>."],
["How much?","<p>Para preguntar el precio: <b>How much is…?</b> (singular) y <b>How much are…?</b> (plural). Para decirlo: <b>It’s</b> / <b>They’re</b> + precio.</p>",mt(["Question","Answer"],[["How much is this jumper?","It’s thirty pounds."],["How much are these shoes?","They’re fifty-five pounds."],["How much is it altogether?","It’s forty euros."]]),[["How much is the coffee? – It’s two pounds.","¿Cuánto cuesta el café? – Dos libras."],["How much are the trousers? – They’re twenty pounds.","¿Cuánto cuestan los pantalones? – Veinte libras."],["This jumper is expensive but that one is cheap.","Este jersey es caro pero ese es barato."]],"El precio con decimales: <b>£4.50</b> = four pounds fifty. Para <b>€</b> se dice <b>euros</b>."],
["Would like","<p>Para pedir algo con educación se usa <b>I’d like…</b> (= I would like). Es más educado que <b>I want</b>. La pregunta es <b>Would you like…?</b></p>",mt(["Use","Example"],[["pedir","I’d like a coffee, please."],["ofrecer","Would you like some tea?"],["aceptar","Yes, please."],["rechazar","No, thank you."]]),[["I’d like two tickets, please.","Querría dos entradas, por favor."],["Would you like a bag? – No, thanks.","¿Quiere una bolsa? – No, gracias."]],"Con <b>would like</b> el verbo siguiente va con <b>to</b>: «I’d like <b>to</b> try it on» (me gustaría probármelo)."],
["Size, colour, payment","<p>Para comprar ropa vas a necesitar preguntar por la talla y el color, y decir cómo pagas.</p>",mt(["You want to say…","English"],[["¿Tiene otra talla?","Have you got a bigger size?"],["¿Puedo probármelo?","Can I try it on?"],["Pago con tarjeta","I’d like to pay by card."],["Pago en efectivo","I’d like to pay in cash."]]),[["I’d like a medium T-shirt, please.","Querría una camiseta de talla mediana."],["Can I try these shoes on?","¿Puedo probarme estos zapatos?"]],"Una tienda <b>closed</b> (cerrada) / <b>open</b> (abierta). En Reino Unido las rebajas son <b>the sales</b>."]
],
[["shop","tienda"],["buy","comprar"],["pay","pagar"],["price","precio"],["jumper","jersey"],["shoes","zapatos"],["size","talla"],["I’d like","querría"],["try on","probarse"],["how much?","¿cuánto cuesta?"]],
[
c("«How ___ is this jumper?»","much",["many","old","long"],"How much = precio."),
c("«How ___ are these shoes?»","much",["many","old","big"],"Precio: how much."),
c("«___ like a coffee, please.»","I’d",["I","I’m","I do"],"I’d like."),
c("Ofreces té: «___ you like some tea?»","Would",["Do","Are","Can"],"Would you like?"),
c("«These ___ expensive.» (trousers)","are",["is","am","be"],"Trousers = plural."),
c("Para pagar con tarjeta dices…","I’d like to pay by card.",["I pay with card.","I pay to card.","I like card pay."],"Pay by card."),
c("Más educado que «I want a coffee»","I’d like a coffee, please.",["Give me a coffee.","I need coffee.","Coffee."],"I’d like…, please."),
c("«Can I try it ___?»","on",["in","at","up"],"Try on."),
t("«I’d like a ___ of shoes.» (par)","pair","A pair of."),
t("«How ___ is it?»","much","How much."),
t("Escribe en inglés: «panadería»","bakery","Bakery."),
b("¿Cuánto cuesta este jersey?","how much is this jumper","","How much is + this + sustantivo."),
b("Querría dos entradas por favor","I’d like two tickets please","","I’d like + two + sustantivo + please.")
],['shops','clothes','money']);

L(17,'a1','Town and directions','La ciudad: lugares, transporte y direcciones','🧭',25,
["Nombrar los lugares de la ciudad","Preguntar y dar direcciones con el imperativo","Hablar del transporte con by y on foot","Pedir ayuda a un desconocido con educación"],
[
["Places in town","<p>Estos son los lugares que más vas a necesitar en una ciudad:</p>",mt(["Place","Spanish"],[[SW("bank"),"banco"],[SW("post office"),"correos"],[SW("station"),"estación"],[SW("library"),"biblioteca"],[SW("park"),"parque"],[SW("hospital"),"hospital"],[SW("cinema"),"cine"],[SW("bus stop"),"parada de autobús"]]),[["The bank is next to the post office.","El banco está al lado de correos."],["There is a park near the station.","Hay un parque cerca de la estación."]],"Con lugares generales se usa <b>the</b>: «the bank», «the station». <b>Town</b> es un pueblo o una ciudad pequeña; <b>city</b> es una ciudad grande."],
["Transport","<p>Para decir cómo te mueves se usa <b>by</b> + medio de transporte (sin artículo). Para ir andando: <b>on foot</b>.</p>",mt(["Transport","Phrase"],[["autobús","by bus"],["tren","by train"],["coche","by car"],["bici","by bike"],["avión","by plane"],["a pie","on foot"]]),[["I go to work by bus.","Voy al trabajo en autobús."],["She goes to school on foot.","Ella va a la escuela a pie."],["We travel to London by train.","Viajamos a Londres en tren."]],"Para subirse: <b>get on the bus</b> / <b>get off the bus</b>. Para el coche: <b>get in the car</b> / <b>get out of the car</b>."],
["Giving directions","<p>Para dar direcciones se usa el <b>imperativo</b> (el verbo base, sin sujeto). Para no hacer algo se añade <b>don’t</b>.</p>",mt(["Direction","English"],[["gira a la izquierda","Turn left."],["gira a la derecha","Turn right."],["sigue recto","Go straight on."],["cruza la calle","Cross the road."],["toma la primera a la izquierda","Take the first left."],["está a tu derecha","It is on your right."]]),[["Go straight on and turn left at the bank.","Sigue recto y gira a la izquierda en el banco."],["Take the second right. It is next to the library.","Toma la segunda a la derecha. Está al lado de la biblioteca."],["Don’t turn right here.","No gires a la derecha aquí."]],"El imperativo es igual para tú y usted: <b>turn</b>, <b>go</b>, <b>cross</b>. Para ser más educado: «<b>Please</b> turn left»."],
["Asking the way","<p>Para preguntar cómo llegar, empieza con una fórmula educada:</p>",mt(["Ask","Reply"],[["Excuse me, where is the station?","It is over there, next to the bank."],["Excuse me, how do I get to the park?","Go straight on, then turn left."],["Is it far from here?","No, it is five minutes on foot."],["Is there a bank near here?","Yes, there is. It is on the corner."]]),[["Excuse me, is there a chemist’s near here?","Perdone, ¿hay una farmacia cerca de aquí?"],["It is about ten minutes on foot.","Está a unos diez minutos a pie."]],"Respuestas útiles: <b>over there</b> (allí), <b>on the corner</b> (en la esquina), <b>at the traffic lights</b> (en el semáforo), <b>opposite</b> (enfrente de)."]
],
[["bank","banco"],["station","estación"],["bus stop","parada de autobús"],["by bus","en autobús"],["on foot","a pie"],["turn left","gira a la izquierda"],["turn right","gira a la derecha"],["go straight on","sigue recto"],["opposite","enfrente de"],["Excuse me","perdone"]],
[
c("«I go to work ___ bus.»","by",["on","with","in"],"By bus."),
c("«She goes to school ___ foot.»","on",["by","at","in"],"On foot."),
c("«___ left at the bank.» (gira)","Turn",["Turns","Turning","To turn"],"Imperativo: turn."),
c("«Go ___ on and turn right.»","straight",["strait","straigh","straightly"],"Go straight on."),
c("Para llamar la atención de un desconocido…","Excuse me",["Hello you","Come here","Sorry you"],"Excuse me."),
c("«It is ___ the corner.»","on",["in","by","to"],"On the corner."),
c("«Is there a bank ___ here?»","near",["next","behind","at"],"Near here."),
c("¿Cuál es correcta?","Don’t turn left here.",["Not turn left here.","Doesn’t turn left here.","You don’t turn."],"Don’t + verbo base."),
t("«___ the road.» (cruza)","Cross","Imperativo."),
t("«The station is ___ the bank.» (enfrente)","opposite","Opposite."),
t("Escribe en inglés: «correos»","post office","Post office."),
b("Gira a la derecha en el banco","turn right at the bank","","Imperativo + at + lugar."),
b("¿Hay un banco cerca de aquí?","is there a bank near here","","Is there + a + sustantivo + near here.")
],['town','transport','directions']);

L(18,'a1','Present continuous','Lo que haces ahora: el presente continuo','⏱️',25,
["Formar el presente continuo con be + -ing","Hablar de lo que ocurre ahora mismo","Diferenciar el presente simple del continuo","Usar las expresiones now, at the moment y right now"],
[
["Form","<p>El presente continuo describe lo que <b>está pasando ahora</b>. Se forma con <b>be</b> (am / is / are) + <b>verbo con -ing</b>.</p>",mt(["Pronoun","be","+ -ing"],[["I","am","working"],["you / we / they","are","working"],["he / she / it","is","working"]]),[["I am reading a book.","Estoy leyendo un libro."],["She is cooking dinner.","Ella está preparando la cena."],["They are watching TV.","Están viendo la tele."]],"Contracciones: <b>I’m, you’re, he’s, she’s, we’re, they’re</b>. Reglas del -ing: <b>make → making</b> (quita la e), <b>run → running</b> (duplica), <b>play → playing</b>."],
["Negative and question","<p>La negación añade <b>not</b> tras be. La pregunta invierte <b>be</b> y el sujeto.</p>",mt(["Affirmative","Negative","Question"],[["I am working.","I am not working.","Am I working?"],["She is cooking.","She is not cooking.","Is she cooking?"],["They are playing.","They are not playing.","Are they playing?"]]),[["What are you doing? – I am studying.","¿Qué estás haciendo? – Estoy estudiando."],["Is he sleeping? – No, he isn’t.","¿Está durmiendo? – No."],["Where are they going?","¿A dónde van?"]],"Las respuestas cortas repiten <b>be</b>: «Yes, I am. / No, she isn’t.»."],
["Now and at the moment","<p>Estas expresiones indican que la acción ocurre <b>ahora</b> y suelen aparecer con el presente continuo.</p>",mt(["Expression","Example"],[["now","I am eating now."],["right now","She is working right now."],["at the moment","We are studying at the moment."],["today","It is raining today."],["these days","He is learning English these days."]]),[["Be quiet! The baby is sleeping.","¡Silencio! El bebé está durmiendo."],["Look! It is snowing.","¡Mira! Está nevando."]],"Con <b>look!</b> y <b>listen!</b> se usa casi siempre el presente continuo: algo que ocurre mientras hablas."],
["Simple or continuous?","<p>Compara los dos presentes: el <b>simple</b> es lo habitual, el <b>continuo</b> es lo que pasa ahora. Algunos verbos (<b>know, like, love, want, need</b>) casi nunca van en continuo.</p>",mt(["Present simple","Present continuous"],[["I work in a bank. (siempre)","I am working at home today. (hoy)"],["She plays tennis on Sundays.","She is playing tennis now."],["I like music.","I am listening to music."]]),[["I usually walk to work, but today I am taking the bus.","Normalmente voy andando al trabajo, pero hoy cojo el autobús."],["I want a coffee. (no «I am wanting»)","Quiero un café."]],"Verbos de estado (know, like, love, want, need, have = poseer) <b>no</b> se usan en continuo."]
],
[["am / is / are","verbo be"],["-ing","terminación"],["now","ahora"],["right now","ahora mismo"],["at the moment","en este momento"],["I’m working","estoy trabajando"],["she is reading","ella está leyendo"],["they are playing","están jugando"],["today","hoy"],["listen!","¡escucha!"]],
[
c("«I ___ reading a book.»","am",["is","are","do"],"I am reading."),
c("«She ___ cooking dinner.»","is",["am","are","does"],"She is cooking."),
c("«They ___ watching TV.»","are",["is","am","does"],"They are watching."),
c("El -ing de «make» es…","making",["makeing","makeng","makking"],"Quita la e."),
c("El -ing de «run» es…","running",["runing","runeing","runn"],"Duplica la n."),
c("¿Cuál es correcta?","Is he sleeping?",["Does he sleeping?","He is sleeping?","Is he sleeps?"],"Be + sujeto + -ing."),
c("«Look! It ___ raining.»","is",["does","has","are"],"It is raining."),
c("¿Qué frase habla de algo habitual?","She plays tennis on Sundays.",["She is playing tennis now.","Listen! She is singing.","They are eating now."],"Habitual = presente simple."),
t("«We ___ studying English.» (be)","are","We are."),
t("«He ___ not working today.» (be)","is","He is not."),
t("Escribe el -ing de «write»","writing","Quita la e."),
b("Estoy leyendo un libro","I am reading a book","","Be + -ing."),
b("¿Qué estás haciendo?","what are you doing","","What + are + you + -ing.")
],['feelings']);

L(19,'a1','Weather and seasons','El tiempo y las estaciones','🌦️',22,
["Hablar del tiempo con it is…","Nombrar las estaciones y los fenómenos atmosféricos","Preguntar «What’s the weather like?»","Describir qué ropa y actividades van con cada tiempo"],
[
["The weather","<p>Para hablar del tiempo se usa <b>it is</b> + adjetivo, o <b>it is</b> + verbo con -ing. El sujeto <b>it</b> es obligatorio.</p>",mt(["Weather","Spanish"],[[SW("sunny, cloudy, windy, rainy, snowy, foggy"),"soleado, nublado, ventoso, lluvioso, nevado, con niebla"],[SW("hot, warm, cool, cold"),"caluroso, templado, fresco, frío"]]),[["It is sunny and warm today.","Hoy hace sol y calor."],["It is raining.","Está lloviendo."],["It is very cold in winter.","Hace mucho frío en invierno."]],"El clima se dice con <b>it is</b>: «it is hot» = hace calor. Nunca «it makes hot» ni «it has hot»."],
["Seasons","<p>Las estaciones llevan <b>in</b>: <b>in spring, in summer, in autumn, in winter</b>. En Estados Unidos «autumn» se llama <b>fall</b>.</p>",mt(["Season","Typical weather"],[[SW("spring"),"mild and rainy"],[SW("summer"),"hot and sunny"],[SW("autumn"),"cool and windy"],[SW("winter"),"cold and snowy"]]),[["In summer it is hot. I go to the beach.","En verano hace calor. Voy a la playa."],["In winter it often snows.","En invierno suele nevar."]],"Las estaciones se escriben con minúscula, a diferencia de los meses y los días."],
["Asking about the weather","<p>Para preguntar por el tiempo hay dos fórmulas frecuentes. Escúchalas.</p>",mt(["Question","Answer"],[["What’s the weather like?","It is cloudy and cold."],["Is it raining?","Yes, it is. / No, it isn’t."],["What’s the temperature?","It is twenty degrees."],["Is it cold today?","Yes, it is."]]),[["What’s the weather like in London? – It is often rainy.","¿Qué tiempo hace en Londres? – A menudo llueve."],["It is five degrees. It’s very cold.","Hay cinco grados. Hace mucho frío."]],"En inglés británico las temperaturas se dan en <b>degrees Celsius</b> (grados centígrados)."],
["Clothes and activities","<p>Relaciona el tiempo con la ropa y los planes. Esto te servirá para escribir y hablar.</p>",mt(["Weather","What I wear / do"],[["sunny","I wear sunglasses. I go to the beach."],["rainy","I take an umbrella. I stay at home."],["cold","I wear a coat and gloves."],["snowy","I wear boots. I make a snowman."]]),[["When it is sunny, I go for a walk.","Cuando hace sol, salgo a pasear."],["It is cold, so I am wearing a coat.","Hace frío, así que llevo abrigo."]],"<b>When</b> + presente simple une el tiempo con lo que haces: «<b>When</b> it rains, I stay at home»."]
],
[["weather","tiempo (clima)"],["sunny","soleado"],["cloudy","nublado"],["windy","ventoso"],["rainy","lluvioso"],["snowy","nevado"],["hot","caluroso"],["cold","frío"],["degrees","grados"],["what’s the weather like?","¿qué tiempo hace?"]],
[
c("«It ___ sunny today.»","is",["has","makes","does"],"It is sunny."),
c("«It is ___ in winter.» (nieve)","snowy",["snow","snows","snowing"],"Adjetivo: snowy."),
c("«What’s the weather ___?»","like",["as","so","for"],"What’s the weather like?"),
c("«In summer it is ___.»","hot",["cold","snowy","windy"],"Summer = hot."),
c("Estación fría con nieve","winter",["summer","spring","autumn"],"Winter."),
c("«I go to the beach ___ it is sunny.»","when",["but","because","or"],"When it is sunny."),
c("«It is ___ degrees.» (veinte)","twenty",["twelve","twenty-two","two"],"Twenty degrees."),
c("¿Cuál es correcta?","It is raining.",["It makes rain.","It has raining.","It does rain."],"It is + verbo -ing."),
t("«It is very ___ in winter.» (frío)","cold","Cold."),
t("Escribe la estación entre primavera y otoño","summer","Summer."),
t("«___ it raining?» (be)","Is","Is it raining?"),
b("Hoy hace mucho calor","it is very hot today","","It is + adjetivo."),
b("¿Qué tiempo hace en Londres?","what is the weather like in London","","What is the weather like in…?")
],['weather']);

L(20,'a1','Jobs and work','Trabajos: What do you do?','💼',22,
["Nombrar profesiones y lugares de trabajo","Preguntar y contestar «What do you do?»","Describir tu jornada y tu lugar de trabajo","Usar a / an con las profesiones"],
[
["Jobs","<p>Las profesiones llevan <b>a / an</b> cuando se dicen con be: <b>I am a teacher</b>, <b>she is an engineer</b>. No cambian con el género: <b>actor</b> sirve para hombre y mujer (aunque existe actress).</p>",mt(["Job","Spanish"],[[SW("doctor"),"médico"],[SW("nurse"),"enfermero"],[SW("teacher"),"profesor"],[SW("engineer"),"ingeniero"],[SW("driver"),"conductor"],[SW("cook"),"cocinero"],[SW("farmer"),"agricultor"],[SW("shop assistant"),"dependiente"],[SW("manager"),"director"],[SW("police officer"),"agente de policía"]]),[["My sister is a nurse.","Mi hermana es enfermera."],["He is an engineer.","Él es ingeniero."]],"Muchas profesiones usan <b>-er / -or</b>: <b>teacher, driver, actor, doctor</b>. Antes de una vocal se usa <b>an</b>: «an actor», «an engineer»."],
["What do you do?","<p>Para preguntar por la profesión se dice <b>What do you do?</b> (¿A qué te dedicas?). También <b>What is your job?</b>. Para el lugar: <b>Where do you work?</b></p>",mt(["Question","Answer"],[["What do you do?","I am a teacher."],["Where do you work?","I work in a school."],["What does she do?","She is a doctor."],["Where does he work?","He works at a hospital."]]),[["What do you do? – I am an accountant.","¿A qué te dedicas? – Soy contable."],["Where does she work? – She works in a bank.","¿Dónde trabaja? – Trabaja en un banco."]],"<b>Work in</b> + lugar o ciudad (in a bank, in London); <b>work at</b> + empresa o sitio concreto (at a hospital, at a supermarket); <b>work for</b> + empresa."],
["Places of work","<p>Estos son los lugares donde se trabaja:</p>",mt(["Place","Who works there"],[[SW("office"),"manager, secretary"],[SW("hospital"),"doctor, nurse"],[SW("factory"),"worker, engineer"],[SW("school"),"teacher"],[SW("restaurant"),"cook, waiter"],[SW("shop"),"shop assistant"]]),[["I work in an office. I start at nine and finish at five.","Trabajo en una oficina. Empiezo a las nueve y termino a las cinco."]],"<b>Start</b> y <b>finish</b> sirven para el horario: «I start work at eight and finish at four»."],
["My working day","<p>Para describir tu jornada usa el presente simple con las rutinas que ya conoces:</p>","",[["I am a nurse. I work at a hospital.","Soy enfermera. Trabajo en un hospital."],["I get up at six and I start work at seven.","Me levanto a las seis y empiezo a trabajar a las siete."],["I finish at three and I go home by bus.","Termino a las tres y vuelvo a casa en autobús."]],"Con tu trabajo: «I like my job» (me gusta mi trabajo), «I work from Monday to Friday» (trabajo de lunes a viernes)."]
],
[["job","trabajo"],["work","trabajar"],["office","oficina"],["hospital","hospital"],["factory","fábrica"],["doctor","médico"],["teacher","profesor"],["engineer","ingeniero"],["what do you do?","¿a qué te dedicas?"],["manager","director"]],
[
c("«She is ___ engineer.»","an",["a","the","some"],"Engineer empieza por vocal: an."),
c("«He is ___ teacher.»","a",["an","the","some"],"Teacher empieza por consonante: a."),
c("¿Cómo se pregunta la profesión?","What do you do?",["What are you do?","Who do you do?","How do you do job?"],"What do you do?"),
c("«Where ___ she work?»","does",["do","is","has"],"She → does."),
c("«He ___ in a hospital.»","works",["work","is work","do work"],"He + works."),
c("«I work ___ a bank.»","in",["on","by","to"],"Work in a bank."),
c("Quien trabaja en un hospital y cura a los enfermos es…","a doctor",["a farmer","a driver","a cook"],"Doctor."),
c("Quien cocina en un restaurante es…","a cook",["a driver","a nurse","a manager"],"Cook."),
t("«I start work ___ eight.» (a las ocho)","at","At + hora."),
t("«What ___ you do?»","do","What do you do?"),
t("Escribe en inglés: «fábrica»","factory","Factory."),
b("¿A qué se dedica tu hermana?","what does your sister do","","What does + sujeto + do."),
b("Trabajo en una oficina","I work in an office","","In + an + vocal.")
],['jobs']);

L(21,'a1','Pronouns','Pronombres: me, you, mine, yours','👥',22,
["Usar los pronombres objeto me, you, him, her, it, us, them","Usar los pronombres posesivos mine, yours, his, hers, ours, theirs","Preguntar «Whose is it?»","Evitar repetir los nombres con pronombres"],
[
["Object pronouns","<p>Los <b>pronombres objeto</b> se usan <b>después del verbo</b> o de una preposición. Cada pronombre sujeto tiene su forma de objeto.</p>",mt(["Subject","Object","Example"],[["I","me","Anna helps me."],["you","you","I like you."],["he","him","I know him."],["she","her","They love her."],["it","it","Take it."],["we","us","Call us."],["they","them","I see them."]]),[["Can you help me, please?","¿Puedes ayudarme, por favor?"],["I don’t know them.","No los conozco."],["She is talking to him.","Ella le está hablando."]],"Después de una preposición también se usan: «with me», «for him», «to us», «about them»."],
["Possessive pronouns","<p>Los <b>pronombres posesivos</b> sustituyen al nombre: <b>mine</b> = el mío, <b>yours</b> = el tuyo… No llevan sustantivo detrás.</p>",mt(["Adjective","Pronoun","Example"],[["my","mine","The bag is mine."],["your","yours","The phone is yours."],["his","his","The car is his."],["her","hers","The key is hers."],["our","ours","The house is ours."],["their","theirs","The dog is theirs."]]),[["This book is mine, not yours.","Este libro es mío, no tuyo."],["Whose coat is this? – It’s hers.","¿De quién es este abrigo? – Suyo (de ella)."]],"Compara: <b>my</b> bag (con sustantivo) frente a <b>mine</b> (solo): «This is my bag» / «This bag is mine»."],
["Whose?","<p>Para preguntar <b>de quién</b> es algo se usa <b>Whose</b> + sustantivo + be. Respuesta: nombre con ’s, o pronombre posesivo.</p>",mt(["Question","Answer"],[["Whose bag is this?","It’s mine."],["Whose keys are these?","They’re Tom’s."],["Whose is this phone?","It’s hers."]]),[["Whose shoes are those? – They’re ours.","¿De quién son esos zapatos? – Nuestros."],["Whose is this? – It is Anna’s.","¿De quién es esto? – De Anna."]],"No confundas <b>whose</b> (de quién) con <b>who’s</b> (= who is, quién es)."],
["Avoiding repetition","<p>Los pronombres evitan repetir los nombres. Fíjate cómo mejora el texto:</p>","",[["I have a sister. Her name is Ana. I love her very much.","Tengo una hermana. Se llama Ana. La quiero mucho."],["My parents live in Madrid. I visit them every month.","Mis padres viven en Madrid. Los visito cada mes."],["This is my book. It is mine, not yours.","Este es mi libro. Es mío, no tuyo."]],"Sujeto → verbo → <b>objeto</b>: «She loves <b>him</b>». Si cambias el orden cambia el significado: «He loves her»."]
],
[["me","me, a mí"],["him","le, lo (él)"],["her","la, le (ella)"],["us","nos"],["them","los, las, les"],["mine","mío"],["yours","tuyo"],["hers","de ella (suyo)"],["ours","nuestro"],["whose?","¿de quién?"]],
[
c("«Can you help ___?» (a mí)","me",["I","my","mine"],"Objeto de I: me."),
c("«I know ___.» (a él)","him",["he","his","her"],"Objeto de he: him."),
c("«She loves ___.» (a ellos)","them",["they","their","theirs"],"Objeto de they: them."),
c("«This bag is ___.» (mío)","mine",["my","me","I"],"Pronombre posesivo: mine."),
c("«That house is ___.» (nuestra)","ours",["our","us","we"],"Pronombre: ours."),
c("¿Cuál es correcta?","Whose bag is this?",["Who’s bag is this?","Whose is bag this?","Who bag is this?"],"Whose + sustantivo + be."),
c("«Look at ___!» (nosotros)","us",["we","our","ours"],"Objeto de we: us."),
c("«The keys are ___.» (de ella)","hers",["her","she","herself"],"Pronombre: hers."),
t("«I like ___.» (a ella)","her","Objeto: her."),
t("«It is not my phone. It is ___.» (tuyo)","yours","Yours."),
t("Completa: «___ coat is this?» (¿de quién?)","Whose","Whose."),
b("Esta llave es mía","this key is mine","","Pronombre posesivo al final."),
b("Los conozco","I know them","","Objeto de they: them.")
],[]);

L(22,'a1','Past simple: was and were','El pasado del verbo be: was y were','⏪',22,
["Usar was y were para hablar del pasado","Formar frases negativas y preguntas con was / were","Usar yesterday, last week, ago y otras expresiones de tiempo","Describir cómo era algo o dónde estabas"],
[
["Was and were","<p>El pasado de <b>be</b> tiene dos formas: <b>was</b> (I, he, she, it) y <b>were</b> (you, we, they).</p>",mt(["Pronoun","Present","Past"],[["I","am","was"],["he / she / it","is","was"],["you / we / they","are","were"]]),[["I was at home yesterday.","Ayer estaba en casa."],["They were tired.","Estaban cansados."],["It was a good film.","Fue una buena película."]],"Se usa tanto para «ser» como para «estar» en pasado. La contracción negativa es <b>wasn’t</b> y <b>weren’t</b>."],
["Negative and questions","<p>La negación añade <b>not</b> (wasn’t, weren’t). En la pregunta se invierte el orden, como en presente.</p>",mt(["Affirmative","Negative","Question"],[["I was late.","I wasn’t late.","Was I late?"],["She was happy.","She wasn’t happy.","Was she happy?"],["They were at school.","They weren’t at school.","Were they at school?"]]),[["Were you at home last night? – Yes, I was.","¿Estabas en casa anoche? – Sí."],["Was the film good? – No, it wasn’t.","¿Era buena la película? – No."],["Where were you yesterday?","¿Dónde estabas ayer?"]],"Las respuestas cortas repiten was / were: «Yes, he was», «No, they weren’t»."],
["Time expressions","<p>Con el pasado se usan marcadores que indican cuándo ocurrió:</p>",mt(["Expression","Meaning"],[["yesterday","ayer"],["last night","anoche"],["last week","la semana pasada"],["last year","el año pasado"],["two days ago","hace dos días"],["in 2020","en 2020"],["on Monday","el lunes"]]),[["I was in London last week.","Estuve en Londres la semana pasada."],["He was ill two days ago.","Estuvo enfermo hace dos días."],["We were at the beach in July.","Estuvimos en la playa en julio."]],"<b>Ago</b> va <b>detrás</b> de la expresión: «three years ago», no «ago three years». Y <b>last</b> no lleva preposición: «last week», no «in last week»."],
["Describing the past","<p>Con <b>was / were</b> puedes describir cómo era una persona o un lugar y dónde estabas:</p>","",[["Last summer I was in Italy. The weather was hot and the food was delicious.","El verano pasado estuve en Italia. Hizo calor y la comida estaba deliciosa."],["My grandmother was a teacher. She was very kind.","Mi abuela era profesora. Era muy amable."],["We were not at home last night. We were at the cinema.","Anoche no estábamos en casa. Estábamos en el cine."]],"Contrasta: <b>I am tired</b> (ahora) / <b>I was tired</b> (ayer). Con there: <b>there was</b> (había, singular) y <b>there were</b> (había, plural)."]
],
[["was","fui, era, estuve"],["were","fuimos, eras, estuvieron"],["wasn’t","no fui, no era"],["weren’t","no fuimos, no eran"],["yesterday","ayer"],["last night","anoche"],["last week","la semana pasada"],["ago","hace"],["there was","había (sing.)"],["there were","había (plural)"]],
[
c("«I ___ at home yesterday.»","was",["were","am","is"],"I → was."),
c("«They ___ tired.»","were",["was","are","is"],"They → were."),
c("«She ___ late.» (no)","wasn’t",["weren’t","isn’t","don’t"],"She → wasn’t."),
c("«___ you at home last night?»","Were",["Was","Are","Do"],"You → were."),
c("«It ___ a good film.»","was",["were","is","are"],"It → was."),
c("«Where ___ you yesterday?»","were",["was","are","do"],"You → were."),
c("¿Cómo se dice «hace dos días»?","two days ago",["ago two days","before two days","last two days"],"Ago va detrás."),
c("«There ___ two chairs.» (pasado)","were",["was","are","is"],"Plural → were."),
t("«We ___ in London last year.» (be)","were","We were."),
t("«He ___ at school yesterday.» (be)","was","He was."),
t("Completa: «Was she happy? – No, she ___.»","wasn’t","No, she wasn’t."),
b("Ayer estaba en casa","I was at home yesterday","","Was + at home + yesterday."),
b("¿Dónde estabas anoche?","where were you last night","","Where + were + you."),
],[]);

L(23,'a1','Past simple: regular verbs','El pasado simple: verbos regulares con -ed','🕰️',25,
["Formar el pasado de los verbos regulares con -ed","Aplicar las reglas de ortografía (-ed, -ied, doblar consonante)","Pronunciar las tres terminaciones: /t/, /d/, /id/","Contar lo que hiciste ayer o el fin de semana"],
[
["Add -ed","<p>El pasado simple se usa para acciones <b>terminadas</b> en el pasado. En los verbos regulares se añade <b>-ed</b> a todas las personas: no cambia con he / she / it.</p>",mt(["Verb","Past","Example"],[["work","worked","I worked yesterday."],["play","played","She played tennis."],["watch","watched","We watched a film."],["walk","walked","They walked home."]]),[["I worked in a shop last year.","El año pasado trabajé en una tienda."],["She watched TV last night.","Ella vio la tele anoche."],["We played football on Sunday.","Jugamos al fútbol el domingo."]],"El pasado tiene una sola forma para todas las personas: <b>I worked, you worked, he worked, we worked, they worked</b>. Más fácil que en castellano."],
["Spelling rules","<p>Algunos verbos cambian al añadir -ed:</p>",mt(["Verb ends in…","Rule","Example"],[["-e","solo + d","live → lived, dance → danced"],["consonante + y","y → ied","study → studied, try → tried"],["vocal + y","+ ed","play → played, enjoy → enjoyed"],["una vocal + una consonante (sílaba fuerte)","doblar consonante","stop → stopped, plan → planned"]]),[["She lived in Madrid for two years.","Vivió en Madrid dos años."],["He studied hard for the exam.","Estudió mucho para el examen."],["We stopped at a café.","Paramos en una cafetería."]],"Excepciones útiles: <b>travel → travelled</b> (inglés británico, se dobla la l) y <b>visit → visited</b> (no se dobla)."],
["Three sounds of -ed","<p>La terminación <b>-ed</b> no suena siempre igual. Hay tres sonidos:</p>",mt(["Sound","When","Examples"],[["/t/","después de sonidos sordos (k, p, s, ch, sh)",SW("worked, watched, stopped, danced")],["/d/","después de sonidos sonoros y vocales",SW("played, lived, called, enjoyed")],["/id/","después de t o d",SW("wanted, needed, started, visited")]]),[["worked (una sílaba)","wanted (dos sílabas)"]],"Solo cuando el verbo termina en <b>t</b> o <b>d</b> se oye una sílaba extra: <b>want → wanted</b>."],
["Yesterday and last weekend","<p>Practica con una narración corta. Léela en voz alta y fíjate en cada <b>-ed</b>:</p>","",[["Yesterday I woke up at seven and I worked all morning.","Ayer me desperté a las siete y trabajé toda la mañana."],["In the afternoon I cleaned the house and I cooked dinner.","Por la tarde limpié la casa y cociné la cena."],["In the evening we watched a film and I talked to my sister on the phone.","Por la noche vimos una película y hablé con mi hermana por teléfono."]],"Verbos muy usados en pasado: <b>called, helped, listened, looked, opened, started, visited, waited, wanted, worked</b>."]
],
[["worked","trabajé"],["played","jugué"],["watched","vi, miré"],["walked","caminé"],["lived","viví"],["studied","estudié"],["stopped","paré"],["wanted","quise"],["visited","visité"],["yesterday","ayer"]],
[
c("El pasado de «work» es…","worked",["workt","working","works"],"Work + ed."),
c("El pasado de «live» es…","lived",["liveed","livd","lives"],"Termina en e: + d."),
c("El pasado de «study» es…","studied",["studyed","studed","studys"],"Consonante + y → ied."),
c("El pasado de «stop» es…","stopped",["stoped","stoping","stopt"],"Duplica la p."),
c("El pasado de «play» es…","played",["plaied","playd","plays"],"Vocal + y: + ed."),
c("«She ___ TV last night.»","watched",["watch","watches","watching"],"Pasado: watched."),
c("«I ___ in London last year.»","lived",["live","lives","am live"],"Pasado: lived."),
c("¿En cuál se oye una sílaba extra al final?","wanted",["worked","played","stopped"],"/id/ después de t o d."),
t("Escribe el pasado de «visit»","visited","Visit + ed."),
t("Escribe el pasado de «try»","tried","y → ied."),
t("«We ___ football on Sunday.» (play)","played","Played."),
b("Ayer trabajé en casa","I worked at home yesterday","","Pasado regular + yesterday."),
b("Ella vivió en Madrid","she lived in Madrid","","Lived: sin cambios con she.")
],[]);

L(24,'a1','Past simple: irregular verbs','El pasado simple: verbos irregulares, negativas y preguntas','📖',28,
["Usar los irregulares más comunes (go–went, have–had, see–saw…)","Formar negativas con didn’t + infinitivo","Formar preguntas con Did + sujeto + infinitivo","Contar un fin de semana o unas vacaciones"],
[
["Irregular verbs","<p>Muchos verbos comunes tienen un pasado <b>irregular</b>: hay que aprenderlos. Igual que los regulares, no cambian según la persona.</p>",mt(["Infinitive","Past"],[["go","went"],["have","had"],["see","saw"],["eat","ate"],["buy","bought"],["make","made"],["take","took"],["get","got"],["come","came"],["write","wrote"]]),[["I went to the cinema yesterday.","Ayer fui al cine."],["She bought a new coat.","Se compró un abrigo nuevo."],["We ate pizza last night.","Anoche comimos pizza."]],"El pasado de <b>be</b> ya lo conoces: was / were. Otros muy útiles: <b>do → did, say → said, give → gave, know → knew, think → thought</b>."],
["Negatives with didn’t","<p>La negación en pasado usa <b>didn’t</b> (did not) + <b>verbo en infinitivo</b>. El verbo vuelve a su forma base.</p>",mt(["Affirmative","Negative"],[["I went out.","I didn’t go out."],["She bought it.","She didn’t buy it."],["We saw him.","We didn’t see him."],["They worked.","They didn’t work."]]),[["I didn’t see my friends yesterday.","Ayer no vi a mis amigos."],["He didn’t eat breakfast.","No desayunó."]],"Error típico: «I didn’t went». Tras <b>didn’t</b> el verbo va en <b>infinitivo</b>: «I didn’t go»."],
["Questions with Did","<p>Las preguntas empiezan por <b>Did</b> + sujeto + <b>infinitivo</b>. Se contesta con <b>Yes, I did</b> / <b>No, I didn’t</b>.</p>",mt(["Question","Short answer"],[["Did you go to school?","Yes, I did."],["Did she see the film?","No, she didn’t."],["Did they have lunch?","Yes, they did."],["What did you buy?","A coat."],["Where did he go?","To London."]]),[["Did you have a good weekend? – Yes, I did.","¿Pasaste un buen fin de semana? – Sí."],["What did you eat? – I ate rice and fish.","¿Qué comiste? – Arroz y pescado."]],"Pasado en la pregunta: <b>did</b>. El verbo principal no lleva pasado: «Did you <b>go</b>?», no «Did you went?»."],

["Vowel changes","<p>Segundo grupo: cambia la vocal. <b>i → a</b> (sing → sang, drink → drank) y <b>-ew</b> (know → knew, fly → flew).</p>",mt(["Base","Past simple","Español"],[["sing",SS("sang"),"cantar"],["swim",SS("swam"),"nadar"],["drink",SS("drank"),"beber"],["begin",SS("began"),"empezar"],["ring",SS("rang"),"sonar"],["sink",SS("sank"),"hundir"],["know",SS("knew"),"saber, conocer"],["grow",SS("grew"),"crecer"],["fly",SS("flew"),"volar"],["throw",SS("threw"),"lanzar"],["draw",SS("drew"),"dibujar"],["blow",SS("blew"),"soplar"]]),[["We swam in the sea last summer.","El verano pasado nadamos en el mar."],["He knew the answer and flew home.","Sabía la respuesta y voló a casa."]],"Truco: aprende los verbos por grupos de sonido, no uno a uno."],
["-t / -d endings and others","<p>Tercer grupo: terminan en <b>-t</b> o <b>-d</b> (sleep → slept, tell → told, build → built). Después, los más sueltos.</p>",mt(["Base","Past simple","Español"],[["sleep",SS("slept"),"dormir"],["keep",SS("kept"),"guardar, mantener"],["feel",SS("felt"),"sentir"],["leave",SS("left"),"salir, dejar"],["send",SS("sent"),"enviar"],["spend",SS("spent"),"gastar, pasar (tiempo)"],["lend",SS("lent"),"prestar"],["build",SS("built"),"construir"],["sell",SS("sold"),"vender"],["tell",SS("told"),"contar, decir"],["hold",SS("held"),"sostener"],["lose",SS("lost"),"perder"],["meet",SS("met"),"conocer, quedar con"],["hear",SS("heard"),"oír"],["say",SS("said"),"decir"],["pay",SS("paid"),"pagar"],["stand",SS("stood"),"estar de pie"],["understand",SS("understood"),"entender"],["sit",SS("sat"),"sentarse"],["win",SS("won"),"ganar"],["find",SS("found"),"encontrar"],["make",SS("made"),"hacer, fabricar"],["have",SS("had"),"tener"],["get",SS("got"),"conseguir, llegar"],["mean",SS("meant"),"significar"]]),[["I slept eight hours and I felt great.","Dormí ocho horas y me sentí genial."],["She told me and I understood.","Me lo dijo y lo entendí."]],"El participio de estos verbos es igual que el pasado: <b>told – told</b>. El participio lo verás en A2."],

L(25,'a1','Going to: future plans','El futuro con be going to','🔮',22,
["Hablar de planes con be going to","Formar negativas y preguntas con going to","Usar tomorrow, next week, tonight, in the future","Preguntar y contar tus planes"],
[
["Going to + verb","<p>Para <b>planes</b> y decisiones ya tomadas se usa <b>be going to</b> + infinitivo. Be cambia según la persona.</p>",mt(["Subject","Form","Example"],[["I","am going to","I am going to study."],["he / she / it","is going to","She is going to travel."],["you / we / they","are going to","We are going to eat out."]]),[["I’m going to visit my grandparents tomorrow.","Mañana voy a visitar a mis abuelos."],["They are going to buy a car.","Van a comprar un coche."]],"Contracciones habituales: <b>I’m going to</b>, <b>she’s going to</b>, <b>we’re going to</b>."],
["Negative and questions","<p>Negación: <b>be + not + going to</b>. Pregunta: <b>be</b> al principio.</p>",mt(["Affirmative","Negative","Question"],[["I’m going to work.","I’m not going to work.","Am I going to work?"],["He’s going to come.","He isn’t going to come.","Is he going to come?"],["They’re going to stay.","They aren’t going to stay.","Are they going to stay?"]]),[["Are you going to cook tonight? – Yes, I am.","¿Vas a cocinar esta noche? – Sí."],["What are you going to do on Sunday?","¿Qué vas a hacer el domingo?"]],"Respuestas cortas con be: «Yes, I am», «No, she isn’t». No se repite going to."],
["Future time expressions","<p>Marcadores que acompañan al futuro:</p>",mt(["Expression","Meaning"],[["tonight","esta noche"],["tomorrow","mañana"],["next week","la semana próxima"],["next year","el año próximo"],["on Saturday","el sábado"],["in two days","dentro de dos días"]]),[["We’re going to travel next month.","Vamos a viajar el mes que viene."],["I’m going to see her in two days.","La voy a ver dentro de dos días."]],"<b>In</b> + tiempo = dentro de: «in a week». <b>Ago</b> mira al pasado; <b>in</b> al futuro."],
["My plans","<p>Cuenta tus planes con going to:</p>","",[["Tomorrow I’m going to get up early and go to work.","Mañana voy a levantarme temprano e ir a trabajar."],["On Saturday we’re going to visit the beach.","El sábado vamos a visitar la playa."],["Next year I’m going to learn English better!","El año que viene voy a aprender mejor inglés."]],"No uses going to con el verbo go si suena raro: «I’m going to go» es correcto, pero también puedes decir «I’m going to the cinema»."]
],
[["going to","ir a (futuro)"],["tonight","esta noche"],["tomorrow","mañana"],["next week","la semana próxima"],["next year","el año próximo"],["plan","plan"],["in two days","dentro de dos días"],["soon","pronto"],["later","más tarde"],["I’m going to","voy a"]],

c("«They ___ going to buy a car.»","are",["is","am","does"],"They → are."),

c("«What ___ you going to do?»","are",["do","is","did"],"You → are."),
t("«I ___ going to visit my parents.»","am","I am going to."),

L(26,'a1','Health and social English','Cuerpo, salud y frases sociales: repaso A1','🩺',30,

["The body","<p>Para decir que algo duele se usa <b>My … hurts</b> o <b>I have a …ache</b>.</p>",mt(["Part","Spanish"],[[SW("head"),"cabeza"],[SW("stomach"),"estómago"],[SW("back"),"espalda"],[SW("throat"),"garganta"],[SW("tooth"),"diente"],[SW("arm"),"brazo"],[SW("leg"),"pierna"],[SW("hand"),"mano"]]),[["My head hurts.","Me duele la cabeza."],["I have a headache.","Tengo dolor de cabeza."],["My legs hurt.","Me duelen las piernas."]],"Con partes del cuerpo se usa el posesivo: <b>my</b> head, <b>his</b> back (no «the head»). Plural: <b>hurt</b>, singular: <b>hurts</b>."],
["At the doctor’s","<p>Frases útiles en la consulta y en la farmacia:</p>",mt(["Question or phrase","Meaning"],[["What’s the matter?","¿Qué te pasa?"],["I feel ill.","Me siento mal."],["I have a cold.","Estoy resfriado."],["I need a doctor.","Necesito un médico."],["Take this medicine twice a day.","Toma esta medicina dos veces al día."]]),[["I have a temperature and a sore throat.","Tengo fiebre y dolor de garganta."],["You should rest and drink water.","Deberías descansar y beber agua."]],"<b>Should</b> + infinitivo da consejos: «You should sleep», «You shouldn’t work»."],
["Social English","<p>Invitar, aceptar y rechazar con educación:</p>",mt(["Situation","Phrase"],[["Invite","Would you like to come?"],["Accept","Yes, I’d love to."],["Refuse","Sorry, I can’t."],["Thank","Thank you very much."],["Apologise","I’m sorry I’m late."]]),[["Would you like some coffee? – Yes, please.","¿Te apetece café? – Sí, por favor."],["Do you want to come to the cinema? – I’d love to, but I can’t.","¿Quieres ir al cine? – Me encantaría, pero no puedo."]],"<b>I’d like</b> = quisiera (más educado que «I want»)."],
["A1 review","<p>¡Has terminado A1! Con lo aprendido ya puedes: presentarte, hablar de tu familia, casa y rutina, pedir comida, preguntar direcciones, usar el pasado y decir tus planes.</p>","",[["Last weekend I felt ill, so I stayed at home. I didn’t go out.","El fin de semana pasado me sentí mal y me quedé en casa. No salí."],["Tomorrow I’m going to see the doctor. I think I have a cold.","Mañana voy a ir al médico. Creo que tengo un resfriado."],["Would you like to come with me? – I’d love to!","¿Quieres venir conmigo? – ¡Me encantaría!"]],"Ahora toca el <b>test de nivel</b> y el nivel <b>A2</b>."]
],

c("«My legs ___.»","hurt",["hurts","is hurt","hurting"],"Plural: hurt."),
c("Quieres decir que estás resfriado:","I have a cold.",["I am a cold.","I have cold a.","I am cold have."],"Have a cold."),

c("Para rechazar con educación:","Sorry, I can’t.",["Yes, I’d love to.","Of course.","Please."],"Rechazar."),
c("«You ___ rest.» (consejo)","should",["are","do","have"],"Should + infinitivo."),
c("«I ___ like some water.» (educado)","would",["can","do","am"],"I’d = I would."),

["Quick review","<p>Pasado simple = acción terminada. Regulares: <b>-ed</b>. Irregulares: hay que saberlos. Negativa: <b>didn’t + infinitivo</b>. Pregunta: <b>Did + sujeto + infinitivo</b>.</p>",mt(["Type","Example"],[["Regular","We visited Bath in May."],["Irregular","I took the early train."],["Negative","She didn’t answer the phone."],["Question","Did you enjoy the concert?"],["With be","They were at the station."]]),[["When did you arrive? – I arrived at six.","¿Cuándo llegaste? – Llegué a las seis."],["He didn’t know the answer.","No sabía la respuesta."]],"Con <b>be</b> no se usa did: «Were you ill?», no «Did you be ill?»."],
["Time markers","<p>Los marcadores sitúan la acción en el pasado:</p>",mt(["Marker","Example"],[["yesterday / last night","I called her yesterday."],["last week / month / year","We moved last year."],["three days ago","He left three days ago."],["in 2019 / in June","I started work in June."],["when I was a child","I lived in Bilbao when I was a child."]]),[["She phoned me two hours ago.","Me llamó hace dos horas."],["We met in 2018.","Nos conocimos en 2018."]],"Con <b>ago</b> no se pone «last»: «two years ago», nunca «last two years ago»."],

[

["Ever and never","<p>Se usa para <b>experiencias</b> sin decir cuándo. <b>Ever</b> = alguna vez (preguntas); <b>never</b> = nunca.</p>",mt(["Question","Answer"],[["Have you ever been to London?","Yes, I have. / No, I haven’t."],["Has she ever eaten sushi?","No, she has never eaten sushi."],["Have they ever seen snow?","Yes, they have."]]),[["I have never been to Rome.","Nunca he estado en Roma."],["Have you ever driven a bus?","¿Has conducido alguna vez un autobús?"]],"Negativa: <b>haven’t / hasn’t + participio</b>. <b>Never</b> ya es negativo: no se usa con not."],
["Been vs gone","<p><b>Been</b> = ha ido y ha vuelto (experiencia). <b>Gone</b> = ha ido y sigue allí.</p>",mt(["Sentence","Meaning"],[["She has been to Italy.","Ha estado en Italia (ya volvió)."],["She has gone to Italy.","Se ha ido a Italia (sigue allí)."]]),[["I have been to the dentist.","He estado en el dentista."],["Where is Tom? – He has gone to the bank.","¿Dónde está Tom? – Ha ido al banco."]],"No se usa con <b>yesterday, last week, ago</b>: para eso, pasado simple."],
["Participles I: same as the past","<p>En muchos irregulares, el <b>participio es igual que el pasado</b>: lo aprendes una vez.</p>",mt(["Base","Past simple","Participio","Español"],[["put","put",SS("put"),"poner"],["cut","cut",SS("cut"),"cortar"],["hit","hit",SS("hit"),"golpear"],["let","let",SS("let"),"dejar, permitir"],["shut","shut",SS("shut"),"cerrar"],["hurt","hurt",SS("hurt"),"doler"],["cost","cost",SS("cost"),"costar"],["set","set",SS("set"),"colocar"],["buy","bought",SS("bought"),"comprar"],["bring","brought",SS("brought"),"traer"],["think","thought",SS("thought"),"pensar"],["teach","taught",SS("taught"),"enseñar"],["catch","caught",SS("caught"),"atrapar"],["sleep","slept",SS("slept"),"dormir"],["keep","kept",SS("kept"),"guardar, mantener"],["feel","felt",SS("felt"),"sentir"],["leave","left",SS("left"),"salir, dejar"],["send","sent",SS("sent"),"enviar"],["spend","spent",SS("spent"),"gastar, pasar (tiempo)"],["lend","lent",SS("lent"),"prestar"],["build","built",SS("built"),"construir"],["sell","sold",SS("sold"),"vender"],["tell","told",SS("told"),"contar, decir"],["hold","held",SS("held"),"sostener"],["lose","lost",SS("lost"),"perder"],["meet","met",SS("met"),"conocer, quedar con"],["hear","heard",SS("heard"),"oír"],["say","said",SS("said"),"decir"],["pay","paid",SS("paid"),"pagar"],["stand","stood",SS("stood"),"estar de pie"],["understand","understood",SS("understood"),"entender"],["sit","sat",SS("sat"),"sentarse"],["win","won",SS("won"),"ganar"],["find","found",SS("found"),"encontrar"],["make","made",SS("made"),"hacer, fabricar"],["have","had",SS("had"),"tener"],["get","got",SS("got"),"conseguir, llegar"],["mean","meant",SS("meant"),"significar"]]),[["I have bought a present.","He comprado un regalo."],["She has told me the truth.","Me ha dicho la verdad."]],"Participio = past: <b>buy–bought–bought, tell–told–told</b>."],
["Participles II: -n / -en and vowel changes","<p>Otros verbos tienen participio propio: terminan en <b>-n / -en</b> o cambian la vocal (<b>sing – sang – sung</b>).</p>",mt(["Base","Past simple","Participio","Español"],[["sing","sang",SS("sung"),"cantar"],["swim","swam",SS("swum"),"nadar"],["drink","drank",SS("drunk"),"beber"],["begin","began",SS("begun"),"empezar"],["ring","rang",SS("rung"),"sonar"],["sink","sank",SS("sunk"),"hundir"],["know","knew",SS("known"),"saber, conocer"],["grow","grew",SS("grown"),"crecer"],["fly","flew",SS("flown"),"volar"],["throw","threw",SS("thrown"),"lanzar"],["draw","drew",SS("drawn"),"dibujar"],["blow","blew",SS("blown"),"soplar"],["speak","spoke",SS("spoken"),"hablar"],["break","broke",SS("broken"),"romper"],["drive","drove",SS("driven"),"conducir"],["wear","wore",SS("worn"),"llevar puesto"],["steal","stole",SS("stolen"),"robar"],["choose","chose",SS("chosen"),"elegir"],["forget","forgot",SS("forgotten"),"olvidar"],["ride","rode",SS("ridden"),"montar"],["wake","woke",SS("woken"),"despertar"],["write","wrote",SS("written"),"escribir"],["eat","ate",SS("eaten"),"comer"],["give","gave",SS("given"),"dar"],["take","took",SS("taken"),"tomar, llevar"],["fall","fell",SS("fallen"),"caer"],["see","saw",SS("seen"),"ver"],["hide","hid",SS("hidden"),"esconder"],["bite","bit",SS("bitten"),"morder"],["shake","shook",SS("shaken"),"sacudir"],["be","was / were",SS("been"),"ser, estar"],["do","did",SS("done"),"hacer"],["go","went",SS("gone"),"ir"],["come","came",SS("come"),"venir"],["run","ran",SS("run"),"correr"]]),[["I have never driven a bus.","Nunca he conducido un autobús."],["Have you ever broken a bone?","¿Te has roto alguna vez un hueso?"],["She has written five emails.","Ha escrito cinco emails."]],"Con present perfect usa siempre el <b>participio</b> (3.ª columna), no el pasado: «I have <b>seen</b>», no «I have saw»."]
],

L(17,'a2','Verb patterns','Verbo + -ing o to + infinitivo, y para qué','🧩',28,

["Verb + to","<p>Estos van con <b>to + infinitivo</b>: <b>want, need, decide, hope, plan, learn, promise, try</b>.</p>",mt(["Verb","Example"],[["want","I want to learn English."],["need","She needs to rest."],["decide","We decided to stay."],["hope","I hope to see you."]]),[["He promised to call me.","Prometió llamarme."],["I’m learning to drive.","Estoy aprendiendo a conducir."]],"<b>Would like to</b> = me gustaría: «I’d like to go». <b>Let / make</b> + persona + infinitivo sin to: «She let me go»."],

["Time clauses","<p>Tras <b>when, as soon as, before, after, until, while</b> se usa <b>presente</b> aunque hable del futuro.</p>",mt(["Example","Meaning"],[["I’ll call you when I arrive.","Te llamaré cuando llegue."],["Wait until I come back.","Espera hasta que vuelva."],["She’ll leave as soon as he comes.","Se irá en cuanto él llegue."]]),[["Before you go, close the windows.","Antes de irte, cierra las ventanas."],["We’ll eat after the film ends.","Cenaremos después de que acabe la película."]],"Español: subjuntivo («cuando llegue»). Inglés: presente simple."],

const U=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const DEC=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function engNum(n){
  if(n<20)return U[n];
  if(n<100){const d=Math.floor(n/10),u=n%10;return u?DEC[d]+'-'+U[u]:DEC[d]}
  if(n<1000){const c=Math.floor(n/100),r=n%100;const h=U[c]+' hundred';return r?h+' and '+engNum(r):h}
  if(n<1000000){const m=Math.floor(n/1000),r=n%1000;const h=engNum(m)+' thousand';return r?h+(r<100?' and ':' ')+engNum(r):h}
  return String(n);
}

  let v=S&&S.set&&S.set.voiceName?VOICES.find(x=>x.name===S.set.voiceName):null;
  if(!v){const gb=en.filter(x=>/^en[-_]GB/i.test(x.lang));v=gb.find(x=>/premium|enhanced|natural|neural/i.test(x.name))||gb[0]||en.find(x=>/premium|enhanced|natural|neural/i.test(x.name))||en[0]||null}

function speakable(t){let x=String(t).replace(/<[^>]+>/g,' ');
  x=x.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F1E6}-\u{1F1FF}️]/gu,' ');
  x=x.replace(/\(=\s*([^)]*)\)/g,', o sigui, $1');
  
  
  x=x.replace(/\b0\d{3,}\b/g,m=>m.split('').map(d=>catNum(+d)).join(' '));
  
  x=x.replace(/\b\d+\b/g,m=>m.length>6?m.split('').map(d=>catNum(+d)).join(' '):catNum(+m));
  x=x.replace(/%/g,' percent').replace(/€/g,' euros');
  x=x.replace(/[«»"“”]/g,'').replace(/\s*[—–→]\s*/g,', ').replace(/…/g,', ').replace(/[+=]/g,' ').replace(/\s*\/\s*/g,', ');
  x=x.replace(/([a-zà-ú])-(?=[a-zà-ú])/gi,'$1 ');
  return x.replace(/[’`´]/g,"'").replace(/\s+/g,' ').trim()}

function pickWords(pool,n,avoid){const p=pool.slice(),out=[],es={};(avoid||[]).forEach(k=>es['#'+k]=1);
  while(out.length<n&&p.length){const wts=p.map(w=>5-mast(w.ca));let r=Math.random()*wts.reduce((a,b)=>a+b,0),i=0;
    for(;i<p.length-1;i++){r-=wts[i];if(r<=0)break}
    const w=p.splice(i,1)[0];const k=nfc(w.es);if(es[k]||es['#'+w.ca])continue;es[k]=1;out.push(w)}
  return out}

function verbQ(inf,tense,p){const v=VERBS[inf];const t=tense||(()=>{const u=unlockedT();return u.length?u[rnd(u.length)]:'pres'})();const n=t==='imper'?5:6;
  let tries=0;while(tries++<20){const pp=(p==null||tries>1)?rnd(n):p;const f=formOf(inf,t,pp);if(!f||/undefined|null/.test(f))continue;

    const post=t==='pres'&&comp?'':'';

    if(rnd(2)){const others=shuf(v.T[t].map((x,i)=>i!==pp&&x&&x!==f&&!/undefined/.test(x)?x:null).filter(Boolean));const ops=[...new Set(others)].slice(0,3);

const LETTER={a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'ell',m:'em',n:'en',o:'oh',p:'pee',q:'cue',r:'are',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zed'};

function keyToQ(key){try{const t=key[0],r=key.slice(2);
  if(t==='w'){const w=WM[r];return w?vq(w):null}
  if(t==='q'){const[l,i]=r.split('#');return LSM[l]&&LSM[l].qs[+i]?lq(l,+i):null}
  if(t==='v'){const[inf,te,p]=r.split('.');return VERBS[inf]?verbQ(inf,te,+p):null}
  if(t==='s'){const s=SENT[+r];return s?sentQ2(s):null}}catch(e){}return null}
function sentQ2(s){const ex=s.x.length?s.x:pick(SENT.filter(z=>z!==s).flatMap(z=>z.t).filter(w=>!s.t.includes(w)),2);return{k:'build',kind:'Construye la frase',es:s.es,tok:s.t,extra:[...new Set(ex)].slice(0,2),ans:s.t.join(' '),tip:s.tip,key:'s:'+SENT.indexOf(s)}}
function mixQ(n){const out=[];const usedW=[];const doneL=Object.keys(S.done);const lids=doneL.length?doneL:LESSONS.filter(l=>l.lv==='a1').slice(0,6).map(l=>l.id);
  while(out.length<n){const r=rnd(10);let q=null;
    if(r<4){const l=LSM[lids[rnd(lids.length)]];q=lq(l.id,rnd(l.qs.length))}
    else if(r<7){const sp=seenPool();const w=pickWords(sp.filter(x=>!usedW.includes(x.ca)),1)[0]||sp[rnd(sp.length)];usedW.push(w.ca);q=vq(w)}
    else if(r<9){const vp=vpool();q=verbQ(vp[rnd(vp.length)])}

/* ===== v2 · Práctica de lección VARIADA =====
   Cada intento = unas 6 preguntas fijas (las escritas a mano, rotadas por historial) + unas 6 generadas
   SOLO con lo que enseña esa lección (frases de ejemplo y palabras clave) => nada se pregunta antes de enseñarse.
   Antimemorización: subconjunto al azar, las menos vistas/falladas primero, orden barajado sin repetir tipo seguido,
   una frase solo una vez por intento, y memoria de lo ya generado para no repetirlo hasta agotar el banco. */
const LANGW='inglés';
const MIXN=17,MIXF=7;
const clnTxt=s=>String(s||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
const wordsOf=t=>t.replace(/[.,;:!?¿¡«»"…]/g,'').split(/\s+/).filter(Boolean);
const sameLen=(a,b)=>Math.abs(wordsOf(a).length-wordsOf(b).length);
function lessonItems(l){const ex=[],seen=new Set();
  (l.steps||[]).forEach(s=>(s.ex||[]).forEach(e=>{const t=clnTxt(e[0]),es=clnTxt(e[1]);
    if(!t||!es||/ [–—] /.test(t)||/ [–—] /.test(es)||t.length>70||seen.has(t))return;seen.add(t);ex.push({t,es})}));
  const kw=(l.kw||[]).map(k=>({t:clnTxt(k[0]),es:clnTxt(k[1])})).filter(k=>k.t&&k.es);
  return{ex,kw}}
function earlierItems(l){const ex=[],kw=[];for(const m of LESSONS){const it=lessonItems(m);ex.push(...it.ex);kw.push(...it.kw);if(m.id===l.id)break}return{ex,kw}}
const OKTYPE=t=>/^[\p{L}\- ]+$/u.test(t)&&t.split(' ').length<=3;
function dSent(e,c,n){const bad=x=>x.t===e.t||x.es===e.es||x.t.toLowerCase()===e.t.toLowerCase();
  const own=new Set(c.exL.map(x=>x.t)),s=c.ex.filter(x=>!bad(x)&&own.has(x.t)),o=c.ex.filter(x=>!bad(x)&&!own.has(x.t));
  const near=a=>a.slice().sort((p,q)=>sameLen(p.t,e.t)-sameLen(q.t,e.t)||rnd(3)-1);
  const out=pick(near(s).slice(0,Math.max(n+2,6)),Math.min(n,s.length));
  if(out.length<n)out.push(...pick(near(o).slice(0,8),n-out.length));return out}
function dKw(k,c,field,n){const bad=x=>x.t===k.t||x[field]===k[field];const own=new Set(c.kwL.map(x=>x.t));
  const u=[];for(const x of shuf(c.kw.filter(x=>!bad(x)&&own.has(x.t)))){if(!u.includes(x[field]))u.push(x[field]);if(u.length>=n)break}
  if(u.length<n)for(const x of shuf(c.kw.filter(x=>!bad(x)&&!own.has(x.t)))){if(!u.includes(x[field])&&x[field]!==k[field])u.push(x[field]);if(u.length>=n)break}
  return u}
const GEN={
 sentC:(e,c)=>{const d=dSent(e,c,3);if(d.length<3)return null;return{k:'choice',kind:'Traduce',p:'Traduce al '+LANGW+': «'+esc(e.es)+'»',ans:e.t,opts:d.map(x=>x.t),e:e.es+' = '+e.t,sayAns:1}},
 listen:(e,c)=>{const d=dSent(e,c,3);if(d.length<3)return null;return{k:'choice',kind:'Escucha y elige',p:'Escucha y elige el significado',say:e.t,hide:1,ans:e.es,opts:d.map(x=>x.es),e:e.t+' = '+e.es}},
 cloze:(e,c)=>{const w=e.t.split(' ');const ok=[];w.forEach((x,i)=>{const cl=x.replace(/[.,;:!?¿¡«»"…]/g,'');if(cl.length>=3&&/^[\p{L}\-]+$/u.test(cl)&&true)ok.push(i)});
   if(w.length<3||!ok.length)return null;const i=ok[rnd(ok.length)],cl=w[i].replace(/[.,;:!?¿¡«»"…]/g,'');const m=w.slice();m[i]=w[i].replace(cl,cl[0]+'___');
   return{k:'type',kind:'Completa la frase',p:'«'+esc(m.join(' '))+'»<br><small class="muted">'+esc(e.es)+'</small>',ans:cl,alts:[cl,cl.toLowerCase()],e:e.t+' = '+e.es,h:'Empieza por «'+cl[0]+'»',sayAns:0}},
 build:(e,c)=>{const tok=wordsOf(e.t);if(tok.length<3||tok.length>9)return null;
   const extra=pick([...new Set(c.ex.filter(x=>x.t!==e.t).flatMap(x=>wordsOf(x.t)).filter(w=>!tok.map(z=>z.toLowerCase()).includes(w.toLowerCase())))],2);
   return{k:'build',kind:'Construye la frase',es:e.es,tok,extra,ans:tok.join(' '),tip:e.t}},
 c1:(k,c)=>{const d=dKw(k,c,'es',3);if(d.length<3)return null;return{k:'choice',kind:'Vocabulario',p:'«'+esc(k.t)+'» significa…',say:k.t,ans:k.es,opts:d,e:k.t+' = '+k.es}},
 c2:(k,c)=>{if(k.es.length<=3)return null;const d=dKw(k,c,'t',3);if(d.length<3)return null;return{k:'choice',kind:'Vocabulario',p:'¿Cómo se dice «'+esc(k.es)+'» en '+LANGW+'?',ans:k.t,opts:d,e:k.es+' = '+k.t,sayAns:1}},
 typ:(k,c)=>{if(!OKTYPE(k.t)||k.es.length<=3)return null;return{k:'type',kind:'Escribe en '+LANGW,p:'«'+esc(k.es)+'»',ans:k.t,alts:[k.t,k.t.toLowerCase()],e:k.t+' = '+k.es,h:'Empieza por «'+k.t[0]+'»',sayAns:1}}};
function lhOf(l){S.lh=S.lh||{};return S.lh[l.id]||(S.lh[l.id]={n:0,f:{},g:[]})}
function genCands(l,c){const it=lessonItems(l),out=[];
  it.ex.forEach(e=>['sentC','listen','cloze','build'].forEach(ty=>out.push({ty,item:e,id:ty+'|'+e.t,grp:'e|'+e.t})));
  it.kw.forEach(k=>['c1','c2','typ'].forEach(ty=>out.push({ty,item:k,id:ty+'|'+k.t,grp:'k|'+k.t})));return out}
function buildLessonQs(l){const h=lhOf(l),c=earlierItems(l),n=h.n+1;const own=lessonItems(l);c.exL=own.ex;c.kwL=own.kw;
  // 1) fijas: las menos vistas / más falladas primero, con ruido para que no sea predecible
  const fx=l.qs.map((q,i)=>({i,s:(h.f[i]!=null?h.f[i]:-5)+rnd(100)/50-(S.weak&&S.weak['q:'+l.id+'#'+i]?3:0)})).sort((a,b)=>a.s-b.s);
  const cand=genCands(l,c),recent=new Set(h.g);let fresh=cand.filter(x=>!recent.has(x.id));
  let need=MIXN-MIXF;if(cand.length<need)need=cand.length;
  if(fresh.length<need*2){fresh=cand}   // banco corto: se permite repetir, pero barajado
  // 2) generadas: barajar, máx. 2 por tipo y una vez cada frase/palabra por intento
  const out=[],used=new Set(),tc={};
  for(const x of shuf(fresh)){if(out.length>=need)break;if(used.has(x.grp)||(tc[x.ty]||0)>=2)continue;
    const q=GEN[x.ty](x.item,c);if(!q)continue;q.gid=x.id;out.push(q);used.add(x.grp);tc[x.ty]=(tc[x.ty]||0)+1}
  if(out.length<need){for(const x of shuf(fresh)){if(out.length>=need)break;if(used.has(x.grp))continue;const q=GEN[x.ty](x.item,c);if(!q)continue;q.gid=x.id;out.push(q);used.add(x.grp)}}
  const nf=Math.min(l.qs.length,MIXN-out.length);
  const fixed=fx.slice(0,nf).map(o=>{h.f[o.i]=n;return lq(l.id,o.i)});
  out.forEach(q=>{h.g.push(q.gid)});h.g=h.g.slice(-40);h.n=n;
  // 3) orden barajado evitando dos del mismo tipo seguidas
  let all=shuf(fixed.concat(out));
  for(let i=1;i<all.length;i++){if(all[i].k===all[i-1].k&&all[i].kind===all[i-1].kind){for(let j=i+1;j<all.length;j++){if(all[j].kind!==all[i-1].kind){[all[i],all[j]]=[all[j],all[i]];break}}}}
  save();return all}

function gmPlay(mode){JG.stop();const cfg=GS.mem;cfg.mode=mode;const timed=mode==='t',key='mem-'+cfg.id+'-'+mode;let t=90,pairs=0,boards=0,sc=0,moves=0,open=[],lock=false,cards=[],found=0;const t0=Date.now();

  const six=()=>{const out=[];for(const w of shuf(cfg.words)){if(norm(w.ca)===norm(w.es))continue;if(out.some(x=>norm(x.es)===norm(w.es)||norm(x.ca)===norm(w.ca)||norm(x.ca)===norm(w.es)||norm(x.es)===norm(w.ca)))continue;out.push(w);if(out.length===6)break}return out};
  function board(){const sx=six();cards=[];sx.forEach((w,i)=>cards.push({id:i,ca:1,a:w.em,b:w.ca},{id:i,ca:0,a:'',b:stripA(w.es)}));cards=shuf(cards);open=[];found=0;lock=false;

  function flip(el){const i=+el.dataset.i;if(lock||el.classList.contains('up'))return;el.classList.add('up');open.push(i);if(cards[i].ca)say(cards[i].b);
    if(open.length===2){moves++;const a=cards[open[0]],b=cards[open[1]],els=open.map(k=>$('#jg').children[k]);
      if(a.id===b.id&&a.ca!==b.ca){els.forEach(x=>x.classList.add('done'));open=[];found++;pairs++;sc+=10;upd();
        if(found===6){if(timed){boards++;sc+=20;t=Math.min(120,t+5);upd();lock=true;setTimeout(()=>{if(JG.live)board()},650)}
          else{const s=Math.max(0,Math.round(1000-moves*40-(Date.now()-t0)/1000*6));setTimeout(()=>{if(JG.live)jgResult(cfg.ca+' · Pairs',s,moves+' movimientos · '+Math.round((Date.now()-t0)/1000)+' s',key,15,'gmagain')},700)}}}
      else{lock=true;setTimeout(()=>{els.forEach(x=>x.classList.remove('up'));open=[];lock=false},timed?550:800)}if(!timed)upd()}}
  $('#app').innerHTML=jgHead(esc(cfg.ca),timed?'⭐ 0':'0 mov.')+(timed?'<div class="timer"><i id="jtb" style="width:100%"></i></div><p class="muted" style="text-align:center">⏱ <b id="jtt">90</b> s · tablero completo: +20 y +5 s</p>':'<p class="muted" style="text-align:center">Une cada palabra inglesa con su significado.</p>')+'<div class="jg-g3" id="jg"></div>';

function aeItem(cat,cats,mode){const verbs=mode==='tense'?aeVerbs():null;
  for(let n=0;n<80;n++){let inf,t,p=rnd(6);
    if(mode==='tense'){inf=one(verbs);t=cat}else{inf=cat;t='pres'}
    const v=VERBS[inf],f=v.T[t]&&v.T[t][p];if(!f)continue;
    if(mode==='tense'){if(cats.some(o=>o!==t&&v.T[o]&&v.T[o].includes(f)))continue}
    else{if(cats.some(o=>o!==inf&&VERBS[o].T.pres.includes(f)))continue}
    return{txt:PRON_S[p]+' '+f,ty:cat}}
  return null}

  const lab=c=>mode==='tense'?VT_NAMES[c][0]:c,dsc=c=>mode==='tense'?VT_NAMES[c][0]+' — '+VT_NAMES[c][2]:c+' ('+VERBS[c].es+')';
  let lives=3,sc=0,tgt=one(sel),items=[],last=0,spawn=0,sp=44,ok=0,pauseT=0;

  const setT=()=>{$('#jtg').textContent=dsc(tgt)};setT();
  const hud=()=>{const c=$('#jchip');if(c)c.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)+' · '+sc};
  const note=(html,cls,top)=>{const ar=$('#jar');if(!ar)return null;const n=document.createElement('div');n.className='jg-notice '+(cls||'');if(top)n.style.top=top;n.innerHTML=html;ar.appendChild(n);return n};
  const lose=()=>{lives--;hud();if(lives<=0){JG.live=false;jgResult('Verb rain',sc,ok+' aciertos','ae',Math.min(40,ok*2+2),'gaego','<p class="muted">'+sel.map(lab).join(' · ')+'</p>')}};
  const announce=()=>{pauseT=1.6;items.forEach(o=>{o.dead=1;o.el.remove()});items=[];spawn=1.2;const lvl=Math.floor(ok/6)+1;
    const n=note('<span>¡Cambio! · Nivel '+lvl+'</span><b>Ahora:  '+esc(lab(tgt))+'</b>');const tg=document.querySelector('.jg-target');if(tg)tg.classList.add('chg');try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
    setTimeout(()=>{if(n)n.remove();if(tg)tg.classList.remove('chg')},1600)};
  const add=()=>{const good=Math.random()<.45,cat=good?tgt:one(sel.filter(x=>x!==tgt)),it=aeItem(cat,sel,mode),ar=$('#jar');if(!ar||!it)return;
    const el=document.createElement('div');el.className='jg-fall';el.textContent=it.txt;ar.appendChild(el);
    const w=ar.clientWidth-el.offsetWidth-6,o={el,y:-50,ty:it.ty};el.style.left=Math.max(2,rnd(Math.max(w,2)))+'px';items.push(o);
    el.onclick=()=>{if(o.dead)return;o.dead=1;
      if(o.ty===tgt){sc+=10;ok++;S.stat.verb++;el.classList.add('good');sp=Math.min(100,44+Math.floor(ok/6)*2.5);
        if(ok%20===0&&lives<3){lives++;const n=note('<span>20 aciertos</span><b>+1 ❤️</b>','heal','25%');setTimeout(()=>n&&n.remove(),1100)}
        hud();if(ok%6===0){tgt=one(sel.filter(x=>x!==tgt));setT();announce()}}
      else{el.classList.add('bad');lose()}
      setTimeout(()=>el.remove(),250);items=items.filter(x=>x!==o)}};
  const loop=ts=>{if(!JG.live||!$('#jar'))return;if(!last)last=ts;const dt=Math.min(.1,(ts-last)/1000);last=ts;
    if(pauseT>0){pauseT-=dt;JG.r=requestAnimationFrame(loop);return}
    spawn-=dt;if(spawn<=0){add();spawn=Math.max(.9,1.6-Math.floor(ok/6)*.03)}
    const H=$('#jar').clientHeight;items.slice().forEach(o=>{o.y+=sp*dt;o.el.style.transform='translateY('+o.y+'px)';if(o.y>H-34){o.dead=1;o.el.remove();items=items.filter(x=>x!==o);if(o.ty===tgt)lose()}});

const h32=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};

ativo «tal cual», sin garantías. Puede contener errores; si encuentras alguno, nos ayudarás a mejorarlo.</p></div></div>';

/* ===== v6: Sobre mi, generador de frases, A2 difuminado, puerta de práctica ===== */
const seenPool=()=>{const s=seenWords();if(s.length>=8)return s;const f=WORDS.filter(w=>(LSM.a11?LSM.a11.th:[]).includes(w.th));return f.length>=8?f:WORDS.filter(w=>w.th==='greet')};

/* Sobre mi */
const isVow=s=>/^[aeiouhàèéíòóúAEIOUH]/.test(s);
function meQs(){const m=S.me||{};const out=[];
  if(m.name){out.push({k:'build',kind:'Sobre mí',es:'Me llamo '+m.name+'.',tok:['my','name','is',m.name],extra:['am','I'],ans:'my name is '+m.name,tip:'Presentarse: my name is…',key:'me:name'});
    out.push({k:'type',kind:'Sobre mí',p:'«Me llamo '+esc(m.name)+'»',ans:'my name is '+m.name,alts:['my name is '+m.name],e:'My name is '+m.name+'.',h:'Empieza por «my»',key:'me:name2'})}
  if(m.town){out.push({k:'build',kind:'Sobre mí',es:'Soy de '+m.town+'.',tok:['I','am','from',m.town],extra:['live','have'],ans:'I am from '+m.town,tip:'To be + from + place.',key:'me:town'});
    out.push({k:'type',kind:'Sobre mí',p:'«Soy de '+esc(m.town)+'»',ans:'I am from '+m.town,alts:['I am from '+m.town],e:'I am from '+m.town+'.',h:'Empieza por «I»',key:'me:town2'})}
  if(m.age>0&&m.age<120){const n=catNum(+m.age);
    out.push({k:'type',kind:'Sobre mí',p:'«Tengo '+m.age+' años»',ans:'I am '+n+' years old',alts:['I am '+n+' years old'],e:'I am '+n+' years old.',h:'Empieza por «I am»',key:'me:age'});
    out.push({k:'build',kind:'Sobre mí',es:'Tengo '+m.age+' años.',tok:['I','am'].concat(n.split(' ')).concat(['years','old']),extra:['have'],ans:'I am '+n+' years old',tip:'La edad se dice con «I am», no con «I have».',key:'me:age2'})}
  return shuf(out)}
V.meform=()=>{const m=S.me||{};const f=(id,l,v,t)=>'<label class="muted">'+l+'</label><input id="'+id+'" type="'+(t||'text')+'" value="'+esc(v||'')+'" autocomplete="off" style="width:100%;padding:12px;margin:4px 0 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit">';

/* Generador de frases por plantillas (solo con verbos y palabras ya estudiados) */
const GFR=[
 {need:'a15',ca:'I have',es:'Tengo',art:'a'},{need:'a18',ca:'I like',es:'Me gusta',art:'a'},{need:'a19',ca:'I need',es:'Necesito',art:'a'},
 {need:'a17',ca:'Where is',es:'¿Dónde está',art:'the',q:1}];
const GTH=new Set(['house','furniture','fruit','animals','things','classroom','transport','town']);
const NP=w=>{if(!GTH.has(w.th))return null;if(!/^[a-z]+$/.test(w.ca)||/s$/.test(w.ca))return null;return{w,n:w.ca}};
function genQ(){
  const fr=GFR.filter(f=>dn(f.need));if(!fr.length)return null;
  const nouns=seenPool().map(NP).filter(Boolean);if(nouns.length<3)return null;
  const f=one(fr),x=one(nouns);
  const art=f.art==='the'?'the':(/^[aeiou]/.test(x.n)?'an':'a');
  const tok=f.ca.split(' ').concat([art,x.n]);
  const es=f.es+(f.q?' ':' … ')+'('+x.w.es+')'+(f.q?'?':'.');
  const pool=WORDS.map(NP).filter(Boolean);
  const ex=pick(pool.filter(y=>y.n!==x.n).map(y=>y.n),2);
  return{k:'build',kind:'Frase nueva',es,tok,extra:ex,ans:tok.join(' '),tip:'Verbo + a / an / the + nombre (an delante de vocal).',key:'g:'+f.ca+'.'+x.w.ca}}
ACT.genq=()=>{const qs=[];let t=0;while(qs.length<10&&t++<80){const q=genQ();if(q&&!qs.some(x=>x.ans===q.ans))qs.push(q)}
  if(qs.length<3){toast('Completa más lecciones para abrir este generador');return}startSession(qs,{per:8})};

/* ===== MODO SILENCIO =====
   Botón 🔊/🔇 en la barra superior y dentro de cada sesión (+ ajuste «Voz» en Me → Settings).
   Con el silencio activado: no suena nada, se ocultan los botones 🔊/🐢 y NO salen ejercicios que necesiten sonido:
   «Escucha y elige» se convierte en lectura («X» significa…) y los dictados/deletreos se omiten. */
const MUTED=()=>!(S.set&&S.set.voice);
const AUDKINDS=['Dictado de números','Deletreo','Dictat de números','Lletrejar'];
function silenceQs(qs){qs=qs.filter(Boolean);if(!MUTED())return qs;
  return qs.map(q=>{
    if(AUDKINDS.includes(q.kind))return null;
    if(q.hide&&q.k==='choice'&&q.say)return Object.assign({},q,{hide:0,say:'',kind:'Vocabulario',p:'«'+esc(q.say)+'» significa…'});
    if(q.hide)return null;
    return q}).filter(Boolean)}
const _ss0=startSession;
startSession=function(qs,o){qs=silenceQs(qs);if(!qs.length){toast('🔇 Este ejercicio necesita sonido: pulsa 🔇 para activarlo');return}return _ss0(qs,o)};
const _qh0=qHead;
qHead=function(q){return _qh0(q).replace('<div class="combo">','<button class="x" data-a="mute" aria-label="Sonido">'+(MUTED()?'🔇':'🔊')+'</button><div class="combo">')};
function applyMute(){try{document.body.classList.toggle('muted',MUTED());
  document.querySelectorAll('[data-a="mute"]').forEach(b=>{b.textContent=MUTED()?'🔇':'🔊';b.setAttribute('aria-pressed',MUTED()?'true':'false')})}catch(e){}}
ACT.mute=()=>{S.set.voice=!S.set.voice;if(!S.set.voice){try{speechSynthesis.cancel()}catch(e){}}save();applyMute();
  toast(MUTED()?'🔇 Silencio: sin sonido ni ejercicios de escucha':'🔊 Sonido activado');if(CUR&&CUR.v==='me')showCur()};
const _v0=ACT.voice;ACT.voice=()=>{_v0();applyMute()};
