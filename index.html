:root{--f-d:'Patrick Hand','Comic Sans MS',cursive,system-ui;--f-b:'Nunito',system-ui,sans-serif;
--bg:#1d3a2f;--bg2:#17302a;--surface:#27493b;--surface2:#2f5546;--ink:#f3f1e4;--muted:#b7c9bd;--line:#4d7260;
--yel:#f4d35e;--on-yel:#2a2406;--pink:#ff9aa8;--pink-s:#5a2f38;--blue:#8fcdea;--grn:#9fe0a8;--grn-s:#235a38;--red-s:#6a2f2f;--red:#ff8f8f;--r:16px}
:root[data-theme="light"]{--bg:#f6f1e3;--bg2:#ece5d1;--surface:#fffdf6;--surface2:#f1ebd8;--ink:#23332b;--muted:#5d6e64;--line:#cfc7ad;
--yel:#d99a00;--on-yel:#ffffff;--pink:#c0394f;--pink-s:#fbe3e6;--blue:#1c6b94;--grn:#1d7a3a;--grn-s:#dcf1df;--red-s:#fbe0e0;--red:#b3261e;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-b);
background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px;
padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
button,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-bottom:110px;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) 0 10px}
.brand{background:none;border:0;padding:4px 0;font:400 28px/1 var(--f-d);color:var(--yel);display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.brand small{font:700 12px var(--f-b);color:var(--muted);letter-spacing:.08em}
.chips{display:flex;gap:8px}.chip{background:var(--surface);border:2px dashed var(--line);border-radius:999px;padding:3px 11px;font:700 15px var(--f-b);white-space:nowrap}
.backbtn{display:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800}
body.sub .backbtn{display:inline-flex}body.sub .brand{display:none}
h1{font:400 clamp(32px,8vw,44px)/1.05 var(--f-d);margin:6px 0 4px;color:var(--yel)}
h2{font:400 26px/1.15 var(--f-d);margin:26px 0 10px;color:var(--yel)}h3{font:400 21px var(--f-d);margin:14px 0 6px}
.sub-t,.muted{color:var(--muted)}p{margin:0 0 10px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.ch{border-style:dashed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 20px;font:800 17px var(--f-b);background:var(--yel);color:var(--on-yel);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.sec{background:var(--surface2);color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:15px;border-radius:11px}.btn.block{display:block;width:100%;text-align:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800}
.pill.on{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg2);border-top:2px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;max-width:130px;border:0;background:none;border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;font:800 12px var(--f-b);color:var(--muted)}
.tab span{font-size:21px;line-height:1.2}.tab.on{background:var(--surface);color:var(--yel)}
body.in-session .tabs,body.sub .tabs{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.tile:active{transform:translateY(3px);box-shadow:none}.tile .ic{font-size:28px}.tile .t{font:400 22px var(--f-d)}.tile .s{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .4s}
.ring{width:80px;height:80px;flex:none}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring .bg{stroke:var(--bg2)}.ring .fg{stroke:var(--yel);transition:stroke-dashoffset .6s}.ring text{font:400 22px var(--f-d);fill:var(--ink)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.lrow .n{font:400 24px var(--f-d);color:var(--yel);min-width:34px}.lrow .ic{font-size:26px}.lrow b{font:400 22px var(--f-d);display:block}.lrow small{color:var(--muted)}
.lrow.done{border-color:var(--grn)}.lrow .ck{color:var(--grn);font-weight:900}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{background:var(--surface2);border:2px solid var(--yel);border-radius:12px;padding:6px 10px;font-size:14px}.badge.off{border-color:var(--line);opacity:.5;filter:grayscale(1)}
.mini{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px}.mini th,.mini td{border:1px solid var(--line);padding:6px 9px;text-align:left}.mini th{background:var(--surface2);color:var(--yel);font-weight:800}
.tw{overflow-x:auto;margin:8px 0}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.ex:last-child{border:0}.ex b{font:400 21px var(--f-d)}
.spk{border:2px solid var(--line);background:var(--surface2);border-radius:50%;width:38px;height:38px;flex:none;font-size:17px;line-height:1;padding:0}
.blur{filter:blur(6px);cursor:pointer;transition:filter .2s}.blur.on{filter:none}
.tip{background:var(--bg2);border-left:5px solid var(--yel);border-radius:8px;padding:10px 12px;margin:10px 0}
.goal{display:flex;align-items:center;gap:14px}
.qtop{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 0 14px}
.x{border:2px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;font-size:17px;padding:0}
.prog{flex:1;height:14px;background:var(--bg2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--grn);transition:width .3s}
.combo{font:400 20px var(--f-d);color:var(--yel);min-width:50px;text-align:right}
.qkind{font:800 12px var(--f-b);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.prompt{font:400 clamp(26px,7vw,34px)/1.15 var(--f-d);margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 15px;font:700 18px/1.3 var(--f-b);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.opt:active{transform:translateY(2px)}.opt.good{border-color:var(--grn);background:var(--grn-s)}.opt.bad{border-color:var(--red);background:var(--red-s)}
.typebox{width:100%;font:400 26px var(--f-d);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.typebox.good{border-color:var(--grn);background:var(--grn-s)}.typebox.bad{border-color:var(--red);background:var(--red-s)}
.fld{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:600 17px var(--f-b)}
textarea.fld{font-size:13px;min-height:90px;word-break:break-all}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));border-top:3px solid;max-height:62vh;overflow:auto;animation:up .2s}
.sheet.good{background:var(--grn-s);border-color:var(--grn)}.sheet.bad{background:var(--red-s);border-color:var(--red)}
.sheet .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}.sheet h3{margin:0;font-size:26px}
.sheet.good h3{color:var(--grn)}.sheet.bad h3{color:var(--red)}.sheet p{margin:0}.sheet small{color:var(--muted)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.spacer{height:200px}

const LESSONS=[];
const mt=(h,r)=>'<table class="mini"><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+r.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table>';
const c=(p,a,w,e,h)=>({k:'choice',p,ans:a,opts:w,e:e||'',h:h||''});
const t=(p,a,e,h)=>({k:'type',p,ans:a,e:e||'',h:h||''});
const b=(es,tok,extra,tip)=>({k:'build',es,tok:tok.split(' '),extra:extra?extra.split(' '):[],tip:tip||''});
const ls=(p,a,w,e)=>({k:'listen',p:p,ans:a,opts:w,e:e||''});
const ESR=[[/\bparticipis\b/g,'participios'],[/\bparticipi\b/g,'participio'],[/\binfinitiu\b/g,'infinitivo'],[/\bgerundi\b/g,'gerundio'],[/\bindicatiu\b/g,'indicativo'],[/\blliçons\b/g,'lecciones'],[/\blliçó\b/g,'lección'],[/\bveurás\b/g,'verás']];
function esx(s){if(!s)return s;return String(s).split(/(<b>.*?<\/b>)/).map((p,i)=>i%2?p:ESR.reduce((a,r)=>a.replace(r[0],r[1]),p)).join('')}
function L(n,lv,ca,es,ic,min,goals,steps,kw,qs,th){
  qs.forEach(q=>{if(q.e)q.e=esx(q.e);if(q.h)q.h=esx(q.h);if(q.tip)q.tip=esx(q.tip)});
  LESSONS.push({id:lv+n,n,lv,ca,es,ic,min,goals:goals.map(esx),steps:steps.map(s=>({t:s[0],h:esx(s[1]),tb:s[2]||'',ex:s[3]||[],tip:esx(s[4]||'')})),kw,qs,th:th?[].concat(th):[]});
}

["The alphabet","<p>El inglés usa las mismas 26 letras que el castellano, pero su <b>nombre</b> es distinto y la ortografía no dice siempre cómo suena una palabra. Escucha cada letra con 🔊 y repite en voz alta.</p><p>En el inglés británico la última letra se dice <b>zed</b> (en Estados Unidos, <b>zee</b>).</p>",mt(["Letter","Name","Example","Spanish"],SA([["A a","ay","apple","manzana"],["B b","bee","book","libro"],["C c","see","cat","gato"],["D d","dee","dog","perro"],["E e","ee","egg","huevo"],["F f","eff","fish","pez"],["G g","jee","green","verde"],["H h","aitch","hat","sombrero"],["I i","eye","ice","hielo"],["J j","jay","jam","mermelada"],["K k","kay","key","llave"],["L l","el","lamp","lámpara"],["M m","em","moon","luna"],["N n","en","nose","nariz"],["O o","oh","orange","naranja"],["P p","pee","pen","bolígrafo"],["Q q","cue","queen","reina"],["R r","ar","red","rojo"],["S s","ess","sun","sol"],["T t","tee","tea","té"],["U u","you","umbrella","paraguas"],["V v","vee","van","furgoneta"],["W w","double-you","water","agua"],["X x","ex","box","caja"],["Y y","why","yellow","amarillo"],["Z z","zed","zebra","cebra"]])),[["How do you spell your name?","¿Cómo se deletrea tu nombre?"],["M-A-R-T-A. Marta.","M-A-R-T-A. Marta."],["Can you spell that, please?","¿Puede deletrearlo, por favor?"]],"Para deletrear por teléfono se dicen los <b>nombres</b> de las letras. Dos letras iguales seguidas se dice <b>double</b>: «double-ell» para LL."],
["Vowel sounds","<p>Las cinco vocales (a, e, i, o, u) tienen sonidos <b>cortos</b> y <b>largos</b>. Una vocal suele ser larga cuando la palabra termina en <b>-e</b> muda: <b>cap</b> / <b>cape</b>.</p>",mt(["Letter","Short sound","Long sound"],[["a","cat (como una «a» abierta)","name (como «ei»)"],["e","bed (como «e»)","see (como «i» larga)"],["i","sit (como «i» corta)","time (como «ai»)"],["o","hot (como «o» abierta)","go (como «ou»)"],["u","cup (entre «a» y «o»)","use (como «iu»)"]]),[["cat – cake","gato – tarta"],["hot – home","caliente – hogar"],["sit – site","sentarse – sitio"]],"Las vocales átonas se debilitan a un sonido neutro llamado <b>schwa</b>: en <b>banana</b> y <b>teacher</b> la última vocal casi no se oye."],
["Tricky consonants","<p>Estos sonidos no existen igual en castellano. Escúchalos y practícalos:</p>",mt(["Spelling","Sounds like…","Examples"],[["<b>th</b> (fuerte)","como la «z» de «zapato» (España)",SW("think, three, thanks")],["<b>th</b> (suave)","como una «d» muy suave",SW("this, the, mother")],["<b>sh</b>","como «sh» al pedir silencio",SW("shop, fish, she")],["<b>ch</b>","como la «ch» de «chico»",SW("cheese, chair, watch")],["<b>j</b> / <b>g</b> suave","como «dy» (yeísmo fuerte)",SW("job, jump, orange")],["<b>w</b>","como «u» + vocal",SW("water, window, we")],["<b>h</b>","aspirada, como una «j» suave",SW("house, hello, hat")],["<b>r</b>","la lengua no vibra, es suave",SW("red, run, three")]]),[["I think this is the cheese.","Creo que este es el queso."],["She has a red hat.","Ella tiene un sombrero rojo."]],"La <b>h</b> es muda en palabras como <b>hour</b> y <b>honest</b>. Y la <b>b</b> y la <b>v</b> NO suenan igual: <b>very</b> y <b>berry</b> son distintas."],
["Word stress","<p>En inglés cada palabra de varias sílabas tiene <b>una sílaba más fuerte</b>. Si la acentúas mal, cuesta entenderte. No hay tilde que te lo indique: hay que aprenderla al oír la palabra.</p>",mt(["Word","Stress","Spanish"],[["<b>TEA</b>cher","1.ª sílaba","profesor"],["ba<b>NA</b>na","2.ª sílaba","plátano"],["<b>FAM</b>ily","1.ª sílaba","familia"],["to<b>MOR</b>row","2.ª sílaba","mañana"]]),[["TEACHer? No: TEAcher.","¿TEACHer? No: TEAcher."]],"Escucha siempre la palabra con 🔊 antes de repetirla. La sílaba fuerte es más larga y más alta."],
["Your first words","<p>Con lo que ya sabes puedes presentarte y pedir que te deletreen una palabra. Son frases hechas: apréndelas tal cual. Aquí <b>it</b> es «lo» (la palabra que quieres deletrear).</p>",mt(["English","Spanish"],[["My name is Marta.","Me llamo Marta."],["How do you spell it?","¿Cómo se deletrea?"],["How do you spell your name?","¿Cómo se deletrea tu nombre?"],["Can you spell that, please?","¿Puede deletrearlo, por favor?"]]),[["My name is Marta. M-A-R-T-A.","Me llamo Marta. M-A-R-T-A."],["How do you spell it? – C-A-T. Cat.","¿Cómo se deletrea? – C-A-T. Cat (gato)."]],"<b>My name is…</b> sirve para presentarte (lo verás con más detalle en la lección 2). <b>How do you spell it?</b> sirve para cualquier palabra."]

["Hello and goodbye","<p>El saludo cambia según la hora y la confianza. <b>Hello</b> vale para casi todo; <b>hi</b> es más informal.</p>",mt(["When?","English","Spanish"],[["mañana","Good morning","Buenos días"],["tarde","Good afternoon","Buenas tardes"],["tarde-noche","Good evening","Buenas tardes / noches"],["al acostarte","Good night","Buenas noches"],["amigos","Hi! How are you?","Hola, ¿qué tal?"],["despedida","Goodbye / Bye","Adiós"],["hasta luego","See you later","Hasta luego"],["hasta mañana","See you tomorrow","Hasta mañana"]]),[["Good morning! How are you?","¡Buenos días! ¿Cómo estás?"],["I am fine, thank you. And you?","Estoy bien, gracias. ¿Y tú?"],["See you tomorrow!","¡Hasta mañana!"]],"«Good night» solo se usa para despedirse al irse a dormir. Para saludar de noche se dice «good evening»."],

["Negatives and questions","<p>Para negar se añade <b>not</b> detrás de be: <b>I am not</b>, <b>he is not</b>. Para preguntar se <b>invierte</b> el orden: <b>Are you…?</b></p>",mt(["Affirmative","Negative","Question"],[["I am Tom.","I am not Tom.","Am I late?"],["You are tired.","You are not tired.","Are you tired?"],["She is a nurse.","She is not a nurse.","Is she a nurse?"],["They are here.","They are not here.","Are they here?"]]),[["Are you from London? – Yes, I am.","¿Eres de Londres? – Sí."],["Is she a teacher? – No, she is not.","¿Es profesora? – No."],["He is not tall.","No es alto."]],"Respuestas cortas: <b>Yes, I am. / No, I am not.</b> No se repite el resto de la frase."],

[
["A, an and the","<p>El artículo <b>a</b> equivale a «un/una»; delante de sonido vocálico se usa <b>an</b>. El artículo <b>the</b> equivale a «el/la/los/las» y no cambia nunca. Los sustantivos no tienen género.</p>",mt(["Article","Use","Example"],[["a","un/una, consonante","a book, a pen"],["an","un/una, vocal","an apple, an egg"],["the","uno concreto","the book on the table"]]),[["I have a pen and an apple.","Tengo un bolígrafo y una manzana."],["The pen is on the table.","El bolígrafo está sobre la mesa."],["It is an umbrella.","Es un paraguas."]],"Cuenta el <b>sonido</b>, no la letra: <b>an hour</b> (la h es muda) pero <b>a university</b> (suena «iu»)."],
["Plurals","<p>El plural regular se forma con <b>-s</b>. Si la palabra termina en <b>s, sh, ch, x</b> se añade <b>-es</b>. Si termina en consonante + <b>y</b>, cambia a <b>-ies</b>. Algunos plurales son irregulares y hay que aprenderlos.</p>",mt(["Singular","Plural","Rule"],[["book","books","+ s"],["box","boxes","+ es"],["bus","buses","+ es"],["watch","watches","+ es"],["city","cities","y → ies"],["man","men","irregular"],["woman","women","irregular"],["child","children","irregular"],["foot","feet","irregular"],["person","people","irregular"]]),[["Two books and three boxes.","Dos libros y tres cajas."],["The children are in the cities.","Los niños están en las ciudades."]],"No existe «a books»: el artículo <b>a</b> solo va con singular. En plural, o no hay artículo o se usa <b>some</b>."],
["This, that, these, those","<p>Para señalar objetos se usa <b>this / these</b> (cerca) y <b>that / those</b> (lejos). Cambian según sea singular o plural.</p>",mt(["","Singular","Plural"],[["cerca","this","these"],["lejos","that","those"]]),[["This is my book.","Este es mi libro."],["That is your bag.","Aquella es tu bolsa."],["These are my keys.","Estas son mis llaves."],["Those are your shoes.","Esos son tus zapatos."]],"Para preguntar: <b>What is this?</b> / <b>What are these?</b> Respuesta: <b>It is a…</b> / <b>They are…</b>"],
["In the classroom","<p>Practica con los objetos que ves cada día. Escúchalos y di en voz alta <b>this is a…</b> / <b>these are…</b></p>",mt(["Word","Spanish"],[["book","libro"],["pen","bolígrafo"],["pencil","lápiz"],["bag","mochila"],["key","llave"],["phone","teléfono"]].map(r=>[SW(r[0]),r[1]])),[["This is a pen. These are pencils.","Esto es un bolígrafo. Esos son lápices."]],"Los objetos que van en pares (<b>glasses, trousers, scissors</b>) siempre son plurales: «my glasses are new»."]
],
[["a / an","un / una"],["the","el / la / los / las"],["this","este / esto"],["that","ese / aquel"],["these","estos"],["those","esos"],["book","libro"],["pen","bolígrafo"],["child","niño"],["children","niños"]],
[
c("«I have ___ apple.»","an",["a","the","some"],"Apple empieza por vocal: an."),
c("«She has ___ pen.»","a",["an","these","two"],"Pen empieza por consonante: a."),
c("El plural de «box» es…","boxes",["boxs","boxies","box"],"Termina en x: + es."),
c("El plural de «city» es…","cities",["citys","cityes","city"],"Consonante + y → ies."),
c("El plural de «child» es…","children",["childs","childes","childen"],"Irregular: children."),
c("Señalas un libro cercano: «___ is my book.»","This",["That","These","Those"],"Cerca y singular: this."),
c("Señalas dos llaves lejanas: «___ are your keys.»","Those",["That","This","These"],"Lejos y plural: those."),
c("¿Cuál es correcta?","I have two books.",["I have two book.","I have a books.","I have two bookes."],"Plural regular: books."),
t("Plural de «man»: ___","men","Irregular."),
t("Completa: «___ is a pencil.» (cerca)","This","This."),
t("Escribe el plural de «watch»","watches","Termina en ch: + es."),
b("Estos son mis libros","these are my books","","These + are + plural."),
b("Eso es un paraguas","that is an umbrella","","An delante de vocal.")
],['things']);

L(4,'a1','Numbers','Números, precios y edad','🔢',22,
["Contar de 0 a 100 y decir números grandes","Decir la edad, el teléfono y los precios","Usar los ordinales (first, second, third…)","Preguntar «How much is it?» y «How old are you?»"],
[
["0 to 20","<p>Del 0 al 12 son palabras propias. De 13 a 19 terminan en <b>-teen</b>. Escucha cada una y repite.</p>",mt(["0–10","11–20"],[[SW("zero, one, two, three, four, five, six, seven, eight, nine, ten"),SW("eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty")]]),[["I have two brothers.","Tengo dos hermanos."],["She is fifteen.","Tiene quince años."]],"Ojo con el acento: <b>thirTEEN</b> (fuerte en -teen) frente a <b>THIRty</b> (fuerte al principio). Así se distinguen 13 y 30."],
["Tens and big numbers","<p>Las decenas terminan en <b>-ty</b>. De 21 a 99 se une decena y unidad con <b>guion</b>. En números de tres cifras se pone <b>and</b> antes de las decenas (en inglés británico).</p>",mt(["Tens","Examples"],[[SW("twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety"),"twenty-one, thirty-five, ninety-nine"],["100","a hundred / one hundred"],["101","a hundred and one"],["1,000","a thousand"],["2,024","two thousand and twenty-four"]]),[["There are forty-two students.","Hay cuarenta y dos estudiantes."],["It is a hundred and fifty euros.","Son ciento cincuenta euros."]],"El 40 es <b>forty</b> (sin «u»). El teléfono se dice cifra por cifra: 612 345 → «six one two, three four five»."],
["Ordinals","<p>Los ordinales sirven para decir fechas, pisos y posiciones. Los tres primeros son especiales; el resto añade <b>-th</b>.</p>",mt(["Number","Ordinal","Short"],[["1","first","1st"],["2","second","2nd"],["3","third","3rd"],["4","fourth","4th"],["5","fifth","5th"],["10","tenth","10th"]]),[["I live on the third floor.","Vivo en la tercera planta."],["She is first and he is second.","Ella es la primera y él es el segundo."]],"El 5 es <b>fifth</b> y el 12 es <b>twelfth</b>: cambian un poco al añadir -th."],
["Prices and age","<p>Para preguntar el precio: <b>How much is it?</b> (singular) / <b>How much are they?</b> (plural). El dinero británico es la libra: <b>£5 = five pounds</b>. La edad se pregunta con <b>How old are you?</b></p>",mt(["Question","Answer"],[["How much is it?","It is five pounds."],["How much is the tea?","It is a pound. (£1 = a pound)"],["How much are the shoes?","They are forty euros."],["How old are you?","I am twenty-two."],["What is your phone number?","It is six one two, three four five."]]),[["How much is the coffee? – Two pounds fifty.","¿Cuánto cuesta el café? – Dos libras cincuenta."],["How old is your sister? – She is twelve.","¿Cuántos años tiene tu hermana? – Doce."]],"Los precios con decimales se leen: <b>£2.50 = two pounds fifty</b>. Dices «and» solo en 101, 250, etc., no en los precios con decimales."]
],
[["twelve","doce"],["twenty","veinte"],["thirty","treinta"],["a hundred","cien"],["a thousand","mil"],["first","primero"],["second","segundo"],["third","tercero"],["how much?","¿cuánto cuesta?"],["how old?","¿cuántos años?"]],
[
c("¿Cómo se dice «15»?","fifteen",["fifty","fiveteen","fifthteen"],"15 = fifteen."),
c("¿Cuál es «40»?","forty",["fourty","fourteen","fortie"],"40 = forty (sin u)."),
c("¿Cómo se dice «13»?","thirteen",["thirty","thirten","three-teen"],"13 = thirteen."),
c("«30» se dice…","thirty",["thirteen","thirtee","three-ten"],"30 = thirty."),
c("¿Cuál es el ordinal de «3»?","third",["three","threeth","thirth"],"3.º = third."),
c("¿Cuál es el ordinal de «2»?","second",["twoth","twond","secondth"],"2.º = second."),
c("Precio £2.50 se lee…","two pounds fifty",["two point five","two and fifty pounds","second pounds fifty"],"Libras y peniques: two pounds fifty."),
c("¿Cómo se pregunta el precio de un solo objeto?","How much is it?",["How many is it?","How old is it?","What price is it?"],"How much is it?"),
t("Escribe en inglés el número 21","twenty-one","Decena + guion + unidad."),
t("Escribe «100» con letras (una palabra o dos)","a hundred","a hundred / one hundred (ambos valen)."),
t("«How ___ are you?» (edad)","old","How old are you?"),
b("¿Cuántos años tienes?","how old are you","","How old + be + sujeto."),
b("Es una libra","it is a pound","","It is + a pound.")
],['num1','num2']);

L(5,'a1','My family','Mi familia: posesivos, ’s y have got','👨‍👩‍👧',22,
["Nombrar a los miembros de la familia","Usar los adjetivos posesivos my, your, his, her…","Expresar posesión con ’s","Decir lo que tienes con «have got»"],
[
["Family words","<p>Estas son las palabras básicas de la familia. Escúchalas.</p>",mt(["Female","Male","Both"],[[SW("mother, sister, grandmother, aunt, daughter, wife"),SW("father, brother, grandfather, uncle, son, husband"),SW("parents, children, cousin, grandparents, friend")]]),[["This is my mother and this is my father.","Esta es mi madre y este es mi padre."],["I have two brothers and one sister.","Tengo dos hermanos y una hermana."]],"Entre amigos, madre y padre se dicen <b>mum</b> y <b>dad</b> (en Reino Unido)."],
["My, your, his, her","<p>Los adjetivos posesivos van <b>delante</b> del sustantivo y no cambian con el género ni con el plural del objeto. Dependen de <b>quién</b> posee.</p>",mt(["Subject","Possessive","Example"],[["I","my","my book"],["you","your","your bag"],["he","his","his sister"],["she","her","her brother"],["it","its","its tail"],["we","our","our house"],["they","their","their children"]]),[["His mother is a doctor.","Su madre (de él) es médica."],["Her mother is a teacher.","Su madre (de ella) es profesora."],["Our parents are on holiday.","Nuestros padres están de vacaciones."]],"En inglés <b>his</b> (de él) y <b>her</b> (de ella) se distinguen: «su madre» tiene dos formas. No lleva artículo: «my mother», nunca «the my mother»."],
["Possessive ’s","<p>Para decir «de quién es» algo se añade <b>’s</b> al poseedor: <b>Anna’s book</b> = el libro de Anna. Si el poseedor es plural y acaba en -s, solo se añade el apóstrofo: <b>the parents’ house</b>.</p>",mt(["Phrase","Meaning"],[["Anna’s brother","el hermano de Anna"],["my sister’s phone","el móvil de mi hermana"],["the children’s toys","los juguetes de los niños"],["my parents’ car","el coche de mis padres"]]),[["Whose bag is this? – It is Tom’s.","¿De quién es esta bolsa? – De Tom."],["That is my uncle’s house.","Esa es la casa de mi tío."]],"No confundas <b>’s</b> posesivo con la contracción de <b>is</b>: «Tom’s my friend» = Tom is my friend. El contexto lo aclara."],
["Have got","<p>Para decir lo que tienes (familia, objetos) se usa <b>have got</b> (muy común en inglés británico). Con he, she, it cambia a <b>has got</b>.</p>",mt(["Pronoun","have got","Negative"],[["I","I have got","I have not got"],["you / we / they","have got","have not got"],["he / she / it","has got","has not got"]]),[["I have got two sisters.","Tengo dos hermanas."],["She has got a big family.","Ella tiene una familia grande."],["Have you got a brother? – Yes, I have.","¿Tienes un hermano? – Sí."]],"Contracciones: <b>I’ve got</b>, <b>she’s got</b>, <b>they’ve got</b>."]
],
[["mother","madre"],["father","padre"],["brother","hermano"],["sister","hermana"],["parents","padres"],["my / your","mi / tu"],["his / her","su (él / ella)"],["our / their","nuestro / su (ellos)"],["have got","tener"],["whose?","¿de quién?"]],
[
c("«She is my aunt. ___ name is Ana.»","Her",["His","Hers","She"],"Ella → her."),
c("«He is my brother. ___ name is Tom.»","His",["Her","He","Its"],"Él → his."),
c("«___ parents are on holiday.» (nuestros)","Our",["We","Us","Ours"],"Nosotros → our: «Our parents are on holiday»."),
c("«They are ___ children.»","their",["them","they","theirs"],"Ellos → their."),
c("«Anna’s mother» significa…","la madre de Anna",["Anna es madre","la madre y Anna","Anna y su madre"],"’s = de."),
c("¿Cuál es correcta?","I have got two brothers.",["I has got two brothers.","I have get two brothers.","I got have two brothers."],"I + have got."),
c("¿Cuál es correcta?","She has got a sister.",["She have got a sister.","She has a got sister.","She got has a sister."],"She + has got."),
c("Pregunta correcta","Have you got a brother?",["Do you got a brother?","Are you got a brother?","You have got a brother?"],"Have + sujeto + got."),
t("«My mother’s sister is my ___»","aunt","La hermana de tu madre es tu tía."),
t("«Her brother» = el hermano de… (escribe he, she o it)","she","Her → she."),
t("Completa: «Tom ___ got a dog.»","has","He/She/It → has got."),
b("Mi hermana tiene un perro","my sister has got a dog","","Has got con he/she."),
b("La casa de mis padres es grande","my parents’ house is big","","Plural que acaba en -s: solo apóstrofo (parents’).")
],['family']);

L(6,'a1','Describing things','Describir: adjetivos, colores y orden','🎨',22,
["Usar adjetivos para describir personas y cosas","Colocar el adjetivo delante del sustantivo","Nombrar los colores","Usar very, quite y really con adjetivos"],
[
["Adjectives","<p>En inglés el adjetivo va <b>delante</b> del sustantivo y <b>no cambia</b>: no tiene género ni plural. <b>a big house</b>, <b>two big houses</b>.</p>",mt(["Adjective","Opposite"],[[SW("big"),SW("small")],[SW("tall"),SW("short")],[SW("old"),SW("young")],[SW("new"),SW("old")],[SW("good"),SW("bad")],[SW("hot"),SW("cold")],[SW("fast"),SW("slow")],[SW("easy"),SW("difficult")]]),[["She is a tall woman.","Es una mujer alta."],["I have a new phone.","Tengo un móvil nuevo."],["These are old books.","Estos son libros viejos."]],"Con <b>be</b> el adjetivo va detrás del verbo: <b>The house is big</b> = <b>a big house</b>."],
["Colours","<p>Los colores son adjetivos y van delante del nombre. Se pueden combinar con <b>light</b> (claro) y <b>dark</b> (oscuro).</p>",mt(["Colour","Spanish"],[[SW("red"),"rojo"],[SW("blue"),"azul"],[SW("green"),"verde"],[SW("yellow"),"amarillo"],[SW("black"),"negro"],[SW("white"),"blanco"],[SW("brown"),"marrón"],[SW("grey"),"gris"],[SW("pink"),"rosa"],[SW("orange"),"naranja"]]),[["I have a red bag and a blue hat.","Tengo un bolso rojo y un sombrero azul."],["It is dark green.","Es verde oscuro."]],"El color <b>orange</b> es también la fruta. Para preguntar el color: <b>What colour is it?</b>"],
["Very, quite, really","<p>Para dar más o menos fuerza al adjetivo se usan <b>very</b> (muy), <b>quite</b> (bastante) y <b>really</b> (de verdad). Van delante del adjetivo.</p>",mt(["Word","Meaning","Example"],[["very","muy","very big"],["really","de verdad, muy","really nice"],["quite","bastante","quite old"],["not very","no muy","not very tall"]]),[["The film is really good.","La película es muy buena."],["My room is quite small.","Mi habitación es bastante pequeña."],["He is not very tall.","No es muy alto."]],"No se dice «very much big»: <b>very</b> va solo delante del adjetivo; <b>very much</b> se usa con verbos."],
["People and things","<p>Con todo lo anterior ya puedes describir. Observa el orden: <b>pronombre + be + adjetivo</b>, o <b>a/an + adjetivo + sustantivo</b>.</p>",mt(["Describe","Example"],[["a person","She is tall and friendly."],["a thing","It is a big, red bag."],["a place","The house is old but nice."],["with a question","What is your teacher like?"]]),[["My teacher is young and very kind.","Mi profesora es joven y muy amable."],["It is a small, white car.","Es un coche pequeño y blanco."]],"Con más de un adjetivo, se separan con comas o con <b>and</b> al final: «a big, old house»."]
],
[["big / small","grande / pequeño"],["tall / short","alto / bajo"],["old / young","viejo / joven"],["new","nuevo"],["good / bad","bueno / malo"],["hot / cold","caliente / frío"],["red","rojo"],["blue","azul"],["very","muy"],["quite","bastante"]],
[
c("El adjetivo en inglés va…","delante del sustantivo",["detrás del sustantivo","con género","con plural"],"a big house."),
c("¿Cuál es correcta?","a red car",["a car red","a reds car","a red cars"],"Adjetivo + sustantivo, sin plural en el adjetivo."),
c("«Two ___ houses» (grandes)","big",["bigs","bigger","bigs house"],"El adjetivo no cambia: big."),
c("¿Cómo se dice «muy alto»?","very tall",["tall very","much tall","very much tall"],"very + adjetivo."),
c("Lo contrario de «hot» es…","cold",["warm","new","short"],"hot ↔ cold."),
c("Lo contrario de «young» es…","old",["new","small","tall"],"young ↔ old."),
c("«It is a ___ bag.» (rojo, grande)","big red",["red big","bigs red","redbig"],"Tamaño antes que color: a big red bag."),
c("Para preguntar el color dices…","What colour is it?",["How colour is it?","Which colour has it?","What is colour?"],"What colour is it?"),
t("Escribe el opuesto de «easy»","difficult","easy ↔ difficult."),
t("«The film is ___ good.» (muy)","very","very + adjetivo."),
t("Escribe en inglés: «rosa» (color)","pink","Pink."),
b("Es una casa vieja y grande","it is a big old house","","a + adjetivos + sustantivo."),
b("Mi coche es azul","my car is blue","","Be + adjetivo.")
],['adj1','colours']);
/* ===== A1 · lessons 7–12 · INGLÉS ===== */

L(7,'a1','There is / There are','Hay… y dónde están las cosas','🏠',22,
["Decir qué hay en un lugar con there is / there are","Usar las preposiciones de lugar: in, on, under, next to…","Nombrar las habitaciones y los muebles","Preguntar «Where is…?» y «Is there…?»"],
[
["There is / There are","<p>Para decir que algo existe o hay en un lugar se usa <b>there is</b> (singular) y <b>there are</b> (plural). El verbo concuerda con lo que viene <b>después</b>.</p>",mt(["Form","Singular","Plural"],[["Affirmative","There is a bed.","There are two chairs."],["Negative","There is not a sofa.","There are not any books."],["Question","Is there a lamp?","Are there any windows?"]]),[["There is a park near my house.","Hay un parque cerca de mi casa."],["There are three rooms.","Hay tres habitaciones."],["Is there a bank here? – Yes, there is.","¿Hay un banco aquí? – Sí."]],"Contracción: <b>there’s</b>. En negativas y preguntas se usa <b>any</b> con plurales: «there are not <b>any</b> chairs»."],
["Prepositions of place","<p>Estas preposiciones dicen <b>dónde está</b> algo respecto a otra cosa.</p>",mt(["Preposition","Meaning","Example"],[["in","dentro de","in the box"],["on","sobre","on the table"],["under","debajo de","under the bed"],["next to","al lado de","next to the door"],["between","entre","between the chairs"],["behind","detrás de","behind the sofa"],["in front of","delante de","in front of the TV"],["near","cerca de","near the window"]]),[["The cat is under the table.","El gato está debajo de la mesa."],["The lamp is next to the bed.","La lámpara está al lado de la cama."],["The keys are in my bag.","Las llaves están en mi bolso."]],"Con lugares se usa <b>at</b> para un punto (at home, at school), <b>in</b> para espacios cerrados (in the kitchen) y <b>on</b> para superficies (on the floor)."],
["Rooms and furniture","<p>Las habitaciones y los muebles que vas a necesitar:</p>",mt(["Rooms","Furniture"],[[SW("kitchen, bedroom, bathroom, living room, garden"),SW("table, chair, sofa, bed, lamp, wardrobe, fridge")]]),[["There is a sofa in the living room.","Hay un sofá en el salón."],["The fridge is in the kitchen.","La nevera está en la cocina."]],"En inglés británico <b>flat</b> es «piso» y <b>house</b> es «casa»; en Estados Unidos «piso» es <b>apartment</b>."],
["Where is…?","<p>Para preguntar dónde está algo: <b>Where is…?</b> (singular) / <b>Where are…?</b> (plural). Para responder, usa las preposiciones.</p>",mt(["Question","Answer"],[["Where is the cat?","It is on the sofa."],["Where are my keys?","They are in the bag."],["Is there a table in the kitchen?","Yes, there is."]]),[["Where is the bathroom? – It is next to the bedroom.","¿Dónde está el baño? – Al lado del dormitorio."]],"Para dar una dirección completa: «My flat is <b>on</b> the second floor, <b>next to</b> the lift»."]
],
[["there is","hay (singular)"],["there are","hay (plural)"],["in","en, dentro de"],["on","sobre"],["under","debajo de"],["next to","al lado de"],["between","entre"],["behind","detrás de"],["kitchen","cocina"],["bedroom","dormitorio"]],
[
c("«There ___ a book on the table.»","is",["are","am","be"],"Singular: there is."),
c("«There ___ two chairs.»","are",["is","am","be"],"Plural: there are."),
c("El gato está debajo de la mesa: «The cat is ___ the table.»","under",["on","in","behind"],"Debajo = under."),
c("La lámpara está al lado de la cama: «next ___ the bed»","to",["at","of","in"],"next to."),
c("Las llaves están dentro del bolso: «___ the bag»","in",["on","under","at"],"Dentro = in."),
c("¿Cuál es la pregunta correcta?","Is there a bank here?",["There is a bank here?","Are there a bank here?","Has there a bank here?"],"Is there…?"),
c("¿Cuál es la pregunta correcta?","Are there any chairs?",["Is there any chairs?","There are any chairs?","Are there a chairs?"],"Are there any + plural."),
c("«Where ___ my keys?»","are",["is","am","be"],"Keys es plural: are."),
t("Completa: «There ___ not a sofa.»","is","There is not…"),
t("«The bed is ___ the wardrobe and the window.» (entre)","between","between."),
t("Escribe en inglés: «cocina»","kitchen","Kitchen."),
b("Hay un parque cerca de mi casa","there is a park near my house","","There is + a + sustantivo."),
b("¿Dónde está el baño?","where is the bathroom","","Where is + sustantivo.")
],['house','furniture','prep']);

L(8,'a1','Present simple I / you / we / they','El presente simple: rutinas y hábitos','🔁',25,
["Formar el presente simple con I, you, we y they","Hablar de rutinas y de lo que haces cada día","Usar los verbos más frecuentes","Usar at, on e in con las horas y los días"],
[
["What is the present simple?","<p>El <b>presente simple</b> sirve para hablar de lo que haces <b>normalmente</b>: rutinas, hábitos y hechos. Con <b>I, you, we, they</b> el verbo es igual que el infinitivo sin «to».</p>",mt(["Pronoun","Verb","Example"],[["I","work","I work in an office."],["you","live","You live in London."],["we","study","We study English."],["they","play","They play football."]]),[["I get up at seven.","Me levanto a las siete."],["We study English on Mondays.","Estudiamos inglés los lunes."],["They live in Madrid.","Viven en Madrid."]],"A diferencia del castellano, el verbo <b>no cambia</b> con la persona (con I, you, we, they). Y el sujeto siempre se dice: no se puede decir «work in an office»."],
["Daily routine","<p>Estos son los verbos de la rutina diaria. Escúchalos y repítelos.</p>",mt(["Phrase","Spanish"],[[SW("wake up"),"despertarse"],[SW("get up"),"levantarse"],[SW("have breakfast"),"desayunar"],[SW("go to work"),"ir al trabajo"],[SW("have lunch"),"comer"],[SW("go home"),"ir a casa"],[SW("have dinner"),"cenar"],[SW("go to bed"),"irse a la cama"]]),[["I wake up at seven and I have breakfast at eight.","Me despierto a las siete y desayuno a las ocho."],["We go home at six.","Volvemos a casa a las seis."]],"Se dice <b>have breakfast / lunch / dinner</b>, no «eat breakfast». Y <b>go to bed</b>, sin artículo."],
["Adverbs of frequency","<p>Para decir <b>con qué frecuencia</b> haces algo se usan adverbios. Van <b>delante</b> del verbo (pero detrás de <b>be</b>).</p>",mt(["Adverb","Meaning","Example"],[["always","siempre","I always get up early."],["usually","normalmente","We usually eat at two."],["often","a menudo","They often play tennis."],["sometimes","a veces","I sometimes walk to work."],["never","nunca","You never drink coffee."]]),[["I never go to bed late.","Nunca me acuesto tarde."],["We often watch TV in the evening.","A menudo vemos la tele por la noche."]],"<b>Never</b> ya es negativo: no se usa con «not». Se dice «I never eat meat», no «I do not never eat meat»."],
["At, on, in","<p>Con las horas y los días se usan tres preposiciones distintas:</p>",mt(["Preposition","Use","Example"],[["at","la hora, momentos","at seven, at night, at the weekend"],["on","los días","on Monday, on Sundays"],["in","partes del día, meses, años","in the morning, in May, in 2024"]]),[["I work on Monday and on Tuesday.","Trabajo el lunes y el martes."],["We have lunch at one o’clock.","Comemos a la una en punto."],["I study in the evening.","Estudio por la tarde-noche."]],"Excepción: se dice <b>in the morning</b>, <b>in the afternoon</b>, <b>in the evening</b>, pero <b>at night</b>."]
],
[["wake up","despertarse"],["get up","levantarse"],["have breakfast","desayunar"],["go to work","ir al trabajo"],["always","siempre"],["usually","normalmente"],["often","a menudo"],["sometimes","a veces"],["never","nunca"],["at / on / in","a / el / en (tiempo)"]],
[
c("«I ___ in a bank.»","work",["works","am work","do work"],"Con I: verbo base."),
c("«We ___ English on Monday.»","study",["studys","studies","studying"],"Con we: verbo base."),
c("«They ___ football on Sundays.»","play",["plays","playing","are play"],"Con they: verbo base."),
c("Desayunas = «I ___ breakfast.»","have",["eat","make","take"],"Have breakfast."),
c("«I always ___ early.»","get up",["gets up","am get up","getting up"],"Adverbio + verbo base."),
c("Con las horas se usa…","at",["on","in","to"],"at seven."),
c("Con los días de la semana se usa…","on",["at","in","by"],"on Monday."),
c("Con «the morning» se usa…","in",["at","on","by"],"in the morning."),
t("«I ___ to bed at eleven.» (ir)","go","Go to bed."),
t("«We ___ lunch at two.» (tener / comer)","have","Have lunch."),
t("Escribe en inglés: «nunca»","never","Never."),
b("Me levanto a las siete","I get up at seven","","At + hora."),
b("Normalmente cenamos a las nueve","we usually have dinner at nine","","Adverbio antes del verbo.")
],['verbs1']);

L(9,'a1','Present simple he / she / it','Él, ella: la -s del presente','🧍',25,
["Añadir -s, -es o -ies con he, she e it","Usar has y does correctamente","Hablar de lo que hacen otras personas","Hablar de la rutina de alguien"],
[
["Add -s","<p>Con <b>he, she, it</b> el verbo añade <b>-s</b> (la «tercera persona»). Es la única diferencia con las demás personas.</p>",mt(["Pronoun","Verb","Example"],[["I / you / we / they","work","They work in an office."],["he / she / it","work<b>s</b>","He work<b>s</b> in an office."]]),[["My brother works in a bank.","Mi hermano trabaja en un banco."],["She lives in London.","Ella vive en Londres."],["The dog sleeps all day.","El perro duerme todo el día."]],"Olvidar la -s es el error más común. Di en voz alta: <b>he works, she lives, it sleeps</b>."],
["-s, -es, -ies","<p>La -s tiene tres versiones según cómo termina el verbo:</p>",mt(["Verb ends in…","Add","Example"],[["la mayoría","-s","play → plays, eat → eats"],["s, sh, ch, x, o","-es","watch → watches, go → goes, wash → washes"],["consonante + y","-ies","study → studies, fly → flies"],["vocal + y","-s","play → plays, enjoy → enjoys"]]),[["She watches TV every night.","Ella ve la tele cada noche."],["He studies English at school.","Él estudia inglés en el colegio."],["My mother goes to work by bus.","Mi madre va al trabajo en autobús."]],"Los dos verbos más irregulares son <b>have → has</b> y <b>be → is</b>: «she <b>has</b> a car», nunca «she haves»."],
["Have and do","<p><b>Have</b> cambia a <b>has</b> y <b>do</b> cambia a <b>does</b> con he, she, it. Son muy frecuentes.</p>",mt(["Verb","he / she / it","Example"],[["have","has","She has breakfast at eight."],["do","does","He does his homework."],["go","goes","It goes fast."],["be","is","She is a nurse."]]),[["He has two sons.","Él tiene dos hijos."],["She does yoga on Fridays.","Ella hace yoga los viernes."]],"En <b>does</b> la -s ya está: no se añade nada más al verbo principal."],
["Talking about someone","<p>Para hablar de la rutina de otra persona usa los mismos verbos con la -s. Lee este ejemplo en voz alta:</p>","",[["My sister gets up at seven. She has breakfast and goes to work by bus.","Mi hermana se levanta a las siete. Desayuna y va al trabajo en autobús."],["She finishes at five and comes home. Then she watches TV.","Termina a las cinco y vuelve a casa. Luego ve la tele."],["My brother never cooks. He eats at his friend’s house.","Mi hermano nunca cocina. Come en casa de su amigo."]],"Para frecuencias, el adverbio va delante del verbo: <b>she always gets up early</b>. Con <b>be</b> va detrás: <b>she is always late</b>."]
],
[["works","trabaja"],["lives","vive"],["has","tiene"],["does","hace"],["goes","va"],["watches","ve"],["studies","estudia"],["plays","juega / toca"],["eats","come"],["sleeps","duerme"]],
[
c("«She ___ in a bank.»","works",["work","working","is work"],"She + verbo con -s."),
c("«He ___ English at school.»","studies",["studys","study","studyes"],"Consonante + y → ies."),
c("«My mother ___ to work by bus.»","goes",["go","gos","going"],"Go → goes."),
c("«The dog ___ all day.»","sleeps",["sleep","sleeping","sleepes"],"It + -s."),
c("«She ___ a big family.» (tener)","has",["have","haves","is have"],"Have → has."),
c("«He ___ his homework every day.»","does",["do","dos","doing"],"Do → does."),
c("«She ___ TV every night.»","watches",["watchs","watch","watching"],"Termina en ch: + es."),
c("¿Cuál es correcta?","He plays tennis on Sundays.",["He play tennis on Sundays.","He plays tennis in Sundays.","He is play tennis on Sundays."],"He plays + on Sundays."),
t("«My father ___ at seven.» (get up)","gets up","He gets up."),
t("«She ___ in London.» (live)","lives","She lives."),
t("Completa: «It ___ fast.» (go)","goes","It goes."),
b("Mi madre trabaja en un banco","my mother works in a bank","","She + works."),
b("Él nunca cocina","he never cooks","","Never antes del verbo.")
],['routine']);

L(10,'a1','Review: be, have and present simple','Repaso: be, have y presente simple','🔄',20,
["Repasar be, have got y el presente simple","Elegir entre I am / I have / I work","Distinguir las personas I, you, he, she","Practicar las rutinas y las descripciones"],
[
["Be, have got or do?","<p>Estos tres patrones cubren casi todas las frases de un principiante. Compara:</p>",mt(["Pattern","Use","Example"],[["be","ser, estar, edad, origen","I am twenty. She is from Spain."],["have got","tener (objetos, familia)","I have got a sister."],["present simple","rutinas y hechos","I work in a bank. He lives here."]]),[["I am a teacher and I have got two sons.","Soy profesor y tengo dos hijos."],["She lives in Madrid and works in a bank.","Ella vive en Madrid y trabaja en un banco."]],"Recuerda: la edad y el origen llevan <b>be</b> (I am 20, I am from Spain), no <b>have</b>."],
["He / she / it","<p>Con he, she, it: <b>be → is</b>, <b>have → has</b>, y los demás verbos añaden <b>-s / -es / -ies</b>.</p>",mt(["I / you / we / they","he / she / it"],[["I am","he is"],["I have got","she has got"],["I work","he works"],["I study","she studies"],["I go","it goes"],["I watch","he watches"]]),[["They study at university. He studies at school.","Ellos estudian en la universidad. Él estudia en el colegio."]],"Para comprobar si falta la -s, pregunta: ¿el sujeto es he, she o it? Si es así, necesita -s."],
["Putting it together","<p>Mira cómo se combinan los tres patrones en una presentación corta. Léela en voz alta:</p>","",[["Hello! My name is Sara and I am from Valencia. I am twenty-four.","¡Hola! Me llamo Sara y soy de Valencia. Tengo veinticuatro años."],["I live with my sister. She is a nurse and she works at a hospital.","Vivo con mi hermana. Ella es enfermera y trabaja en un hospital."],["We have got a small flat. There is a big kitchen and two bedrooms.","Tenemos un piso pequeño. Hay una cocina grande y dos dormitorios."]],"Si tienes dudas, vuelve a las lecciones 2, 5, 8 y 9: ahí están las explicaciones de cada patrón."]
],
[["I am","soy / estoy"],["I have got","tengo"],["he has","él tiene"],["she works","ella trabaja"],["it is","es / está"],["we study","estudiamos"],["they live","viven"],["he does","él hace"],["there is","hay"],["every day","cada día"]],
[
c("«She ___ twenty-five.»","is",["has","are","does"],"La edad lleva be."),
c("«I ___ got two sisters.»","have",["has","am","do"],"I have got."),
c("«He ___ in a hospital.»","works",["work","is work","has work"],"He + -s."),
c("«We ___ in London.»","live",["lives","are live","has live"],"We + verbo base."),
c("«They ___ a big house.»","have",["has","are","does"],"They have."),
c("«My sister ___ English at university.»","studies",["study","studys","is study"],"She + studies."),
c("¿Cuál es correcta?","She has got a dog.",["She have got a dog.","She is got a dog.","She has get a dog."],"She has got."),
c("¿Cuál es correcta?","He is from Spain.",["He has from Spain.","He from Spain.","He be from Spain."],"Origen con be."),
t("«I ___ thirty years old.» (be)","am","I am."),
t("«It ___ big.» (be)","is","It is."),
t("«She ___ breakfast at eight.» (have)","has","She has."),
b("Mi hermano vive en Londres","my brother lives in London","","He + lives."),
b("Tenemos un perro pequeño","we have got a small dog","","Have got + a + adjetivo + sustantivo.")
],[]);

L(11,'a1','Questions and negatives','Preguntas y negaciones con do / does','❓',25,
["Hacer preguntas con do y does","Formar frases negativas con do not y does not","Usar las palabras interrogativas: what, where, when, who, why, how","Dar respuestas cortas"],
[
["Do / Does questions","<p>En presente simple las preguntas se forman con el auxiliar <b>do</b> (I, you, we, they) o <b>does</b> (he, she, it) <b>antes del sujeto</b>. El verbo principal queda en forma base.</p>",mt(["Pronoun","Question","Short answer"],[["I / you / we / they","Do you work here?","Yes, I do. / No, I do not."],["he / she / it","Does she work here?","Yes, she does. / No, she does not."]]),[["Do you live in London? – Yes, I do.","¿Vives en Londres? – Sí."],["Does he play tennis? – No, he does not.","¿Juega al tenis? – No."]],"Con <b>does</b> el verbo principal <b>no lleva -s</b>: «Does she work?», no «Does she works?»."],
["Do not / Does not","<p>Para negar se usa <b>do not</b> (don’t) o <b>does not</b> (doesn’t) más el verbo base.</p>",mt(["Affirmative","Negative"],[["I work.","I do not work."],["We live here.","We do not live here."],["She works.","She does not work."],["It rains.","It does not rain."]]),[["I do not like coffee.","No me gusta el café."],["He does not live in Madrid.","Él no vive en Madrid."],["They don’t eat meat.","No comen carne."]],"Con <b>be</b> y <b>have got</b> no se usa do: «She is not tired», «I have not got a car»."],
["Question words","<p>Las palabras interrogativas van <b>al principio</b>, antes de do / does.</p>",mt(["Word","Meaning","Example"],[["what","qué","What do you do?"],["where","dónde","Where does she live?"],["when","cuándo","When do they work?"],["who","quién","Who do you live with?"],["why","por qué","Why do you study English?"],["how","cómo","How do you go to work?"]]),[["Where do you work? – I work in a school.","¿Dónde trabajas? – Trabajo en un colegio."],["What time does he get up? – At seven.","¿A qué hora se levanta? – A las siete."]],"Con <b>who / what</b> como sujeto no se usa do: «Who lives here?» pero «Who do you live with?»."],
["Short answers","<p>Las respuestas cortas repiten el auxiliar, no el verbo principal:</p>",mt(["Question","Yes","No"],[["Do you like tea?","Yes, I do.","No, I do not."],["Does he work?","Yes, he does.","No, he does not."],["Do they live here?","Yes, they do.","No, they do not."]]),[["Do you speak English? – Yes, I do.","¿Hablas inglés? – Sí."],["Does she eat meat? – No, she doesn’t.","¿Come carne? – No."]],"Contracciones: <b>don’t</b>, <b>doesn’t</b>. Son lo normal en la conversación."]
],
[["do","auxiliar (I, you, we, they)"],["does","auxiliar (he, she, it)"],["do not","no (don’t)"],["does not","no (doesn’t)"],["what","qué"],["where","dónde"],["when","cuándo"],["who","quién"],["why","por qué"],["how","cómo"]],
[
c("«___ you live in London?»","Do",["Does","Are","Is"],"You → do."),
c("«___ she work here?»","Does",["Do","Is","Are"],"She → does."),
c("«He does not ___ here.»","live",["lives","living","to live"],"Después de does not: verbo base."),
c("«I do not ___ tea.» (gustar)","like",["likes","liking","am like"],"Do not + verbo base."),
c("¿Cuál es correcta?","Does he play tennis?",["Does he plays tennis?","Do he play tennis?","Is he play tennis?"],"Does + sujeto + verbo base."),
c("¿Cuál es correcta?","They do not eat meat.",["They not eat meat.","They does not eat meat.","They do not eats meat."],"They do not + verbo base."),
c("Respuesta corta a «Do you like tea?»","Yes, I do.",["Yes, I like.","Yes, I am.","Yes, I does."],"Repite el auxiliar."),
c("Para preguntar la hora de levantarse de él: «What time ___ he get up?»","does",["do","is","has"],"He → does."),
t("«___ they live here?» (do o does)","Do","They → do."),
t("«She ___ not like coffee.» (do / does)","does","She does not."),
t("«___ do you work?» (dónde)","Where","Where do you work?"),
b("¿Dónde vives?","where do you live","","Where + do + sujeto + verbo."),
b("Ella no vive aquí","she does not live here","","Does not + verbo base.")
],['classroom']);

L(12,'a1','Days, months, dates and time','Días, meses, fechas y la hora','📅',25,
["Decir los días de la semana y los meses","Decir la fecha con ordinales","Decir la hora en punto, y media, y cuarto, menos cuarto","Preguntar «What time is it?» y «What day is it?»"],
[
["Days and months","<p>En inglés los días y los meses se escriben <b>con mayúscula</b>. Escucha cada uno.</p>",mt(["Days","Months"],[[SW("Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday"),SW("January, February, March, April, May, June, July, August, September, October, November, December")]]),[["I work on Monday and Tuesday.","Trabajo el lunes y el martes."],["My birthday is in May.","Mi cumpleaños es en mayo."]],"Con días se usa <b>on</b> (on Friday) y con meses <b>in</b> (in May). Con estaciones: <b>in summer</b>, <b>in winter</b>."],
["The date","<p>La fecha usa números <b>ordinales</b> (first, second, third…). En inglés británico se dice el día primero: <b>the fifth of May</b> o <b>May the fifth</b>. En números: <b>5th May</b> o <b>5/5</b>.</p>",mt(["Written","Said"],[["1st January","the first of January"],["2nd March","the second of March"],["3rd June","the third of June"],["14th July","the fourteenth of July"],["25th December","the twenty-fifth of December"]]),[["My birthday is on the tenth of March.","Mi cumpleaños es el diez de marzo."],["Christmas Day is on the twenty-fifth of December.","El día de Navidad es el veinticinco de diciembre."]],"La fecha lleva <b>on</b>: «on the third of June». En <b>1990</b> se dice «nineteen ninety» y en <b>2024</b>, «twenty twenty-four»."],
["Telling the time","<p>Para decir la hora: <b>It is</b> + hora. <b>O’clock</b> = en punto. <b>Half past</b> = y media. <b>Quarter past</b> = y cuarto. <b>Quarter to</b> = menos cuarto.</p>",mt(["Clock","Said"],[["3:00","three o’clock"],["3:30","half past three"],["3:15","quarter past three"],["3:45","quarter to four"],["3:10","ten past three"],["3:50","ten to four"]]),[["What time is it? – It is half past nine.","¿Qué hora es? – Son las nueve y media."],["The film starts at quarter to eight.","La película empieza a las ocho menos cuarto."]],"Del minuto 1 al 30 se dice <b>past</b> (y); del 31 al 59 se dice <b>to</b> (menos). Se usa <b>at</b> con las horas: «at seven o’clock»."],
["Parts of the day","<p>Las partes del día llevan <b>in the</b>, excepto la noche, que lleva <b>at</b>.</p>",mt(["Part","Phrase"],[["mañana","in the morning"],["tarde (desde 12:00)","in the afternoon"],["tarde-noche","in the evening"],["noche","at night"]]),[["I study in the morning.","Estudio por la mañana."],["We go to bed at night.","Nos acostamos por la noche."]],"Para <b>a las 12:00</b> se dice <b>at midday</b> y para <b>a las 00:00</b>, <b>at midnight</b>."]
],
[["Monday","lunes"],["Friday","viernes"],["January","enero"],["May","mayo"],["what time is it?","¿qué hora es?"],["o’clock","en punto"],["half past","y media"],["quarter past","y cuarto"],["quarter to","menos cuarto"],["at night","por la noche"]],
[
c("«My birthday is ___ May.»","in",["on","at","by"],"Con meses: in."),
c("«I work ___ Monday.»","on",["in","at","by"],"Con días: on."),
c("«The film starts ___ seven o’clock.»","at",["in","on","to"],"Con horas: at."),
c("3:30 se dice…","half past three",["three and half","half to three","three thirty past"],"Half past three."),
c("3:15 se dice…","quarter past three",["quarter to three","fifteen to three","three quarter"],"Quarter past."),
c("3:45 se dice…","quarter to four",["quarter past four","three quarter","four and quarter"],"Quarter to four."),
c("«1st» se lee…","first",["one","oneth","fist"],"1st = first."),
c("«I study ___ the morning.»","in",["on","at","to"],"In the morning."),
t("Escribe: «what ___ is it?» (hora)","time","What time is it?"),
t("«It is ten ___ five.» (5:10 = y diez)","past","Past hasta el minuto 30."),
t("Escribe el mes número 6 en inglés","June","June."),
b("¿Qué hora es?","what time is it","","What time is it?"),
b("Mi cumpleaños es en mayo","my birthday is in May","","In + mes.")
],['time','clock']);

L(13,'a1','Can and can’t','Poder: can, can’t y las peticiones','💪',22,
["Hablar de lo que sabes y puedes hacer con can / can’t","Hacer preguntas con can","Pedir cosas y permiso con Can I…? y Can you…?","Usar el teléfono y el correo con frases útiles"],
[
["Can and can’t","<p><b>Can</b> expresa capacidad (saber hacer algo) y posibilidad (poder). Es un verbo especial: va <b>siempre</b> con el verbo base y <b>nunca añade -s</b>. La negación es <b>can’t</b> (cannot).</p>",mt(["Pronoun","can","can’t"],[["I / you / we / they","I can swim","I can’t swim"],["he / she / it","He can swim","He can’t swim"]]),[["I can speak English and French.","Sé hablar inglés y francés."],["She can’t drive a car.","Ella no sabe conducir."],["Can you swim? – Yes, I can.","¿Sabes nadar? – Sí."]],"Con <b>can</b> no se usa do/does: «Can she swim?», nunca «Does she can swim?». Y no lleva «to» después: «I can swim», no «I can to swim»."],
["Questions and short answers","<p>La pregunta invierte <b>can</b> y el sujeto. Las respuestas cortas repiten <b>can</b> o <b>can’t</b>.</p>",mt(["Question","Yes","No"],[["Can you cook?","Yes, I can.","No, I can’t."],["Can he play the guitar?","Yes, he can.","No, he can’t."],["Can they come?","Yes, they can.","No, they can’t."]]),[["Can you play tennis? – No, I can’t.","¿Sabes jugar al tenis? – No."],["Can your brother drive? – Yes, he can.","¿Tu hermano sabe conducir? – Sí."]],"Para preguntar «¿Qué sabes hacer?» se dice <b>What can you do?</b>"],
["Requests and permission","<p><b>Can</b> también sirve para pedir cosas y pedir permiso. Es más educado con <b>could</b> (lo veremos más adelante) y con <b>please</b>.</p>",mt(["You want to…","Say"],[["pedir algo","Can I have a coffee, please?"],["pedir permiso","Can I open the window?"],["pedir ayuda","Can you help me, please?"],["pedir que repitan","Can you repeat that, please?"]]),[["Can I have the bill, please?","¿Me trae la cuenta, por favor?"],["Can you help me? – Of course.","¿Me puedes ayudar? – Claro."],["Can I use your phone? – Sure.","¿Puedo usar tu teléfono? – Claro."]],"Respuestas útiles: <b>Of course</b> (claro), <b>Sure</b> (claro), <b>Sorry, I can’t</b> (lo siento, no puedo)."],
["Phone and messages","<p>Estas son frases de uso diario para llamar y escribir. Escucha y repite.</p>",mt(["English","Spanish"],[[SS("Can I speak to Anna, please?"),"¿Puedo hablar con Anna, por favor?"],[SS("Speak more slowly, please."),"Hable más despacio, por favor."],[SS("Can you send me a message?"),"¿Me puedes mandar un mensaje?"],[SS("What is your email address?"),"¿Cuál es tu correo electrónico?"]]),[["Can you call me tomorrow?","¿Me puedes llamar mañana?"],["I can’t answer the phone now.","No puedo contestar el teléfono ahora."]],"En una llamada: <b>Hello, this is Pol</b> (soy Pol). Para el correo: «at» = @ y «dot» = . (anna <b>at</b> mail <b>dot</b> com)."]
],
[["can","poder, saber"],["can’t","no poder, no saber"],["swim","nadar"],["drive","conducir"],["speak","hablar"],["play","jugar, tocar"],["Can I…?","¿puedo…?"],["Can you…?","¿puedes…?"],["of course","claro"],["call","llamar"]],
[
